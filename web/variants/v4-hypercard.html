<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 · Стопка карточек</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=PT+Sans:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
  :root{--k:#000;--w:#fff;--acc:#19b8d8}
  *{box-sizing:border-box}
  body{margin:0;color:var(--k);font:15px/1.45 "PT Sans",Geneva,sans-serif;
    background-color:#fff;background-image:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0);background-size:4px 4px}
  ::selection{background:var(--acc);color:#000}
  .px{font-family:"Pixelify Sans","PT Mono",monospace}
  .menubar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid #000;display:flex;gap:22px;align-items:center;padding:4px 16px;font:500 16px "Pixelify Sans"}
  .menubar .logo{width:18px;height:18px;border:2px solid #000;display:grid;place-items:center;font-size:11px;font-weight:700}
  .menubar span:last-child{margin-left:auto}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 20px 90px}
  section{margin-top:34px}
  .win{background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000}
  .tbar{height:24px;border-bottom:2px solid #000;display:flex;align-items:center;gap:10px;padding:0 8px;
    background:repeating-linear-gradient(#fff 0 2px,#000 2px 3px) 0 6px/100% 13px no-repeat}
  .tbar .box{width:14px;height:14px;border:2px solid #000;background:#fff}
  .tbar b{margin:0 auto;background:#fff;padding:0 10px;font:600 15px "Pixelify Sans"}
  .card{padding:22px 26px}
  h1,h2,h3{margin:0;font-family:"Pixelify Sans",monospace;font-weight:700}
  .huge{font:700 120px/.9 "Pixelify Sans";letter-spacing:.02em}
  .btn{display:inline-block;border:2px solid #000;border-radius:10px;padding:6px 16px;background:#fff;font:500 16px "Pixelify Sans";margin:4px 6px 4px 0}
  .btn.def{box-shadow:0 0 0 3px #fff,0 0 0 5px #000}
  .btn.on{background:var(--acc)}
  .dith{background-image:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0);background-size:4px 4px}
  .dith2{background-image:radial-gradient(#000 1px,transparent 1.2px);background-size:4px 4px}
  .field{border:2px solid #000;background:#fff;padding:10px 12px}
  .cols{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .chk{display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:14px}
  .chk i{flex:none;width:16px;height:16px;border:2px solid #000;display:grid;place-items:center;font:700 13px/1 "PT Mono";margin-top:2px}
  .chk.on i{background:var(--acc)}
  .chk small{display:block;font:12px "PT Mono"}
  .bar{height:26px;border:2px solid #000;position:relative;background:#fff}
  .bar i{position:absolute;left:0;top:0;bottom:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  table{border-collapse:collapse;width:100%;font:14px "PT Mono"}
  th,td{border:1px solid #000;padding:5px 6px;text-align:center} th{font:600 13px "Pixelify Sans";background:#fff}
  td.crit{background:#000;color:#fff}
  .rolo{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .rc{border:2px solid #000;background:#fff;padding:12px;position:relative}
  .rc .face{width:54px;height:54px;border:2px solid #000;display:grid;place-items:center;font:700 22px "Pixelify Sans"}
  .alert{display:grid;grid-template-columns:70px 1fr;gap:18px;align-items:start}
  .stop{width:64px;height:64px;border:3px solid #000;border-radius:50%;display:grid;place-items:center;font:700 34px "Pixelify Sans"}
  .news{column-count:3;column-gap:22px;column-rule:1px solid #000;font-size:14.5px}
  .mut{font:13px "PT Mono"}
  .hilite{background:var(--acc);padding:0 4px}
  @media(max-width:900px){.menubar{overflow:hidden;gap:12px}.menubar span:nth-child(n+4){display:none}.two,.cols,.rolo{grid-template-columns:1fr}.news{column-count:1}.huge{font-size:72px}}
</style>
</head>
<body>
<div class="menubar"><span class="logo">А</span><span>Файл</span><span>Правка</span><span>Перейти</span><span>Инструменты</span><span>Объекты</span><span class="mut">Кабинет акима · стопка</span></div>
<main class="wrap" id="app">Открываем стопку…</main>
<script src="_kit.js"></script>
<script>
const { num, int, sign, esc, unq, SHORT, QL, scale, path } = KIT;
const win = (title, body, sec) => `<section data-sec="${sec}"><div class="win"><div class="tbar"><span class="box"></span><b>${title}</b></div><div class="card">${body}</div></div></section>`;
function render(D) {
  const inPlan = Object.fromEntries(D.decs.map((d) => [d.measure, d]));
  const tl = D.timeline.map((t) => [t.q, t.score]);
  const html = [
    win('Кабинет акима — Главная', `
      <div class="two" style="align-items:end">
        <div><h1 style="font-size:40px;line-height:1.05">Кабинет акима</h1><p style="font-size:18px;margin:10px 0 0">Стопка из восьми карточек. Пять решений, сто единиц, пять районов Астаны. Движок перебрал все ${int(D.total)} законных плана.</p></div>
        <div style="text-align:right"><div class="mut">Score · IV кв. 2028</div><div class="huge">${num(D.sc)}</div></div>
      </div>
      <div class="field" style="margin-top:18px;font-size:18px">Лучший план формулы — <b>${num(D.best.score)}</b>. С ним аким <span class="hilite">уволен</span>: рейтинг ${num(D.best.approval, 1)}% при пороге 50%.</div>
      <div style="margin-top:16px"><span class="btn def">Кабинет →</span><span class="btn">Вердикт</span><span class="btn">Кризис</span><span class="btn">Газета</span><span class="btn">Турнир</span></div>`, 'A Первый экран'),

    win('Карточка 2 из 8 — Кабинет', `
      <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:10px"><h2 style="font-size:30px">Отметьте пять мер</h2><span class="mut">не больше 2 в направлении · бюджет 100</span></div>
      <div class="cols" style="margin-top:14px">${D.directions.map((dir) => `<div class="field"><h3 style="font-size:17px">${esc(dir.name)}</h3>
        ${D.measures.filter((m) => m.direction === dir.id).map((m) => { const on = inPlan[m.id]; return `<div class="chk ${on ? 'on' : ''}"><i>${on ? '×' : ''}</i><span><b>${m.id}</b> ${esc(m.name)}<small>${m.cost} ед. · лаг ${m.lag} · ${on && on.district ? on.district : m.type === 'district' ? 'район' : 'город'}</small></span></div>`; }).join('')}</div>`).join('')}</div>
      <div style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:16px">
        <div><div class="mut" style="margin-bottom:4px">Бюджет: ${D.cost} из 100 · остаток ${100 - D.cost} не сгорает и не даёт бонуса</div><div class="bar"><i class="dith" style="width:${D.cost}%;border-right:2px solid #000"></i></div></div>
        <span class="btn def on">Принять решения</span></div>`, 'B Кабинет'),

    win('Карточка 3 из 8 — Вердикт', `
      <div class="two">
        <div><div class="mut">Score (AQLS)</div><div class="huge">${num(D.sc)}</div><p style="font-size:18px;margin:6px 0 0">${sign(D.delta)} к старту ${num(D.base)}</p>
          <div class="field" style="margin-top:14px;font-size:17px">максимум ${num(D.best.score)}, ваше место <b>${int(D.rank)}</b> из ${int(D.total)}, топ ${num(D.top, 2)}%</div></div>
        <div><div class="mut">Рейтинг акима · слой политического риска, не входит в Score</div><div class="huge" style="font-size:88px">${num(D.appr, 1)}%</div>
          <div class="bar" style="margin-top:8px"><i class="dith2" style="width:${D.appr}%"></i><i style="left:50%;width:0;border-left:3px solid #000"></i></div>
          <div class="mut" style="display:flex;justify-content:space-between;margin-top:4px"><span>0</span><span>50 · переизбрание</span><span>100</span></div>
          <p style="font-size:18px;margin:12px 0 0"><span class="hilite">Переизбран.</span> Оптимум движка — ${num(D.best.approval, 1)}%, уволен.</p></div>
      </div>`, 'C Вердикт'),

    win('Карточка 4 из 8 — Анализ', `
      <div style="overflow-x:auto"><table><tr><th>Район</th>${D.inds.map((i) => `<th>${i.code}</th>`).join('')}<th>D</th><th>Δ</th></tr>
        ${D.districts.map((d) => `<tr><td style="text-align:left"><b>${esc(d.name)}</b></td>${d.after.map((v, k) => `<td class="${d.before[k] < 40 ? 'crit' : ''}">${num(v, 1)}</td>`).join('')}<td>${num(d.Da)}</td><td>${sign(d.dD)}</td></tr>`).join('')}</table></div>
      <div class="mut" style="margin:6px 0 14px">Чёрные ячейки были ниже 40 до решений. Все вышли из красной зоны.</div>
      <div class="two">
        <div class="field"><div class="mut">Score по кварталам</div><svg viewBox="0 0 460 180" width="100%">${(() => { const sx = (q) => scale(q, 0, 8, 30, 450), sy = (v) => scale(v, 52, 57.5, 160, 10);
          return `<line x1="30" x2="450" y1="${sy(D.best.score)}" y2="${sy(D.best.score)}" stroke="#000" stroke-dasharray="2 3"/><text x="450" y="${sy(D.best.score) - 4}" font-size="11" text-anchor="end" font-family="PT Mono">оптимум ${num(D.best.score)}</text>
            <path d="${path(tl, sx, sy)}" fill="none" stroke="#000" stroke-width="3"/>${tl.map(([q, v]) => `<rect x="${sx(q) - 3}" y="${sy(v) - 3}" width="6" height="6" fill="#fff" stroke="#000" stroke-width="2"/>`).join('')}
            ${[0, 4, 8].map((q) => `<text x="${sx(q)}" y="176" font-size="11" text-anchor="middle" font-family="PT Mono">${QL[q]}</text>`).join('')}`; })()}</svg></div>
        <div class="field"><div class="mut" style="margin-bottom:6px">Вклад каждой меры</div>${D.contrib.map((c) => `<div style="display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;margin:6px 0"><span class="mut">${c.measure} ${c.district || ''}</span><div class="bar" style="height:16px"><i class="dith" style="width:${c.marginal / D.contrib[0].marginal * 100}%"></i></div><b class="mut">+${num(c.marginal)}</b></div>`).join('')}</div>
      </div>
      <div class="field" style="margin-top:16px;max-height:230px;overflow:auto"><h3 style="font-size:17px">Аналитик (✓ числа из движка)</h3><p>${esc(D.ai.summary)}</p>
        <p><b>Сильные стороны.</b> ${D.ai.strengths.map(esc).join(' ')}</p><p><b>Риски.</b> ${D.ai.risks.map(esc).join(' ')}</p><p><b>Компромиссы.</b> ${D.ai.tradeoffs.map(esc).join(' ')}</p></div>
      <div style="margin-top:10px"><span class="btn def">Применить рекомендацию → ${num(D.ai.recommendation.expected_score)}</span></div>`, 'D Анализ'),

    win('Карточка 5 из 8 — Совет районов', `<div class="rolo">${D.councilPre.map((c) => `<div class="rc"><div style="display:flex;gap:10px;align-items:center"><div class="face ${c.mood === 'positive' ? '' : 'dith2'}" style="${c.mood === 'positive' ? 'background:var(--acc)' : ''}">${esc(c.district.slice(0, 2).toUpperCase())}</div><div><b class="px" style="font-size:17px">${esc(c.district)}</b><div class="mut">${c.mood === 'positive' ? 'за' : c.mood === 'negative' ? 'против' : 'воздерж.'} · ${sign(c.delta_D)}</div></div></div><p style="margin:10px 0 0;font-size:14px">«${esc(unq(c.quote))}»</p></div>`).join('')}</div>`, 'E Совет районов'),

    win('Внимание', `<div class="alert"><div class="stop">!</div><div><h2 style="font-size:32px">${esc(D.event.title)}</h2><p style="font-size:16px">${esc(D.event.description)} Нужно заменить ровно одну меру.</p>
      <div class="field" style="font:15px 'PT Mono'">Score ${num(D.res.score_before_crisis)} → без замены ${num(D.res.score_after_crisis_no_swap)} → после замены M12 → M4 Сарыарка <b>${num(D.res.score)}</b><br>Замена лучшая из возможных: ${sign(D.res.recovered)}.<br>Рейтинг ${num(D.appr, 1)}% → <span class="hilite">${num(D.res.approval.city, 1)}%</span> — ниже порога.</div>
      <div style="margin-top:12px;text-align:right"><span class="btn">Отменить</span><span class="btn def on">Заменить</span></div></div></div>`, 'F Кризис'),

    win('Карточка 7 из 8 — Астана Times', `<div style="text-align:center;border-bottom:3px double #000;padding-bottom:8px"><div class="px" style="font-size:54px;font-weight:700;line-height:1">Астана Times</div><div class="mut">${esc(D.paper.date)} · выпуск № 208</div></div>
      <h2 style="font-size:32px;margin:14px 0 6px;text-align:center">${esc(D.paper.headlines[0].title)}</h2><p style="text-align:center;margin:0 0 14px">${esc(D.paper.headlines[0].lead)}</p>
      <div class="news">${D.paper.headlines.slice(1).map((h) => `<p><b class="px" style="font-size:17px">${esc(h.title)}.</b> ${esc(h.lead)}</p>`).join('')}<p><i>${esc(D.paper.editorial)}</i></p></div>`, 'G Газета'),

    win('Карточка 8 из 8 — Турнир', `<table><tr><th>#</th><th style="text-align:left">Команда</th><th>Score</th><th>Рейтинг</th><th>Итог</th></tr>${D.board.map((r, i) => `<tr style="${r.pin === 'me' ? 'background:var(--acc)' : ''}"><td>${i + 1}</td><td style="text-align:left">${esc(r.team)}${r.demo ? ' (пример)' : ''}</td><td><b>${num(r.score)}</b></td><td>${num(r.approval, 1)}%</td><td class="${r.approval < 50 ? 'crit' : ''}">${r.approval < 50 ? 'уволен' : 'переизбран'}</td></tr>`).join('')}</table>`, 'H Лидерборд'),
  ];
  document.getElementById('app').innerHTML = html.join('');
}
KIT.load().then((D) => { render(D); KIT.tags(4); }).catch((e) => { document.getElementById('app').textContent = 'Нет данных: ' + e.message; });
</script>
</body>
</html>
