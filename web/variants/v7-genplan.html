<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7 · Генплан</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;500;600;700&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bp:#14406b;--bp2:#0f3458;--line:#e8f1fb;--faint:rgba(232,241,251,.16);--sky:#19b8d8;--sky2:#7fdcef;--red:#ff6b5b}
  *{box-sizing:border-box}
  body{margin:0;color:var(--line);font:15px/1.45 "PT Sans Narrow",sans-serif;background-color:var(--bp);
    background-image:linear-gradient(var(--faint) 1px,transparent 1px),linear-gradient(90deg,var(--faint) 1px,transparent 1px);background-size:24px 24px}
  ::selection{background:var(--sky);color:var(--bp2)}
  .j{font-family:Jura,"PT Sans Narrow",sans-serif}
  .wrap{max-width:1340px;margin:0 auto;padding:26px 22px 90px}
  section{margin-top:30px}
  .sheet{border:2px solid var(--line);padding:6px 6px 6px 26px;position:relative;background:rgba(15,52,88,.55)}
  .sheet .in{border:1px solid var(--line);padding:18px 20px 110px;position:relative;min-height:300px}
  .stamp{position:absolute;right:-1px;bottom:-1px;width:420px;border-collapse:collapse;font:12px Jura;background:var(--bp2)}
  .stamp td{border:1px solid var(--line);padding:3px 6px;height:22px}
  .stamp .t{font:700 15px Jura;text-align:center}
  h2{font:700 30px/1.1 Jura;letter-spacing:.02em;margin:0 0 4px;text-transform:uppercase}
  .note{font:14px Jura;opacity:.85}
  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
  .num{font:700 96px/.9 Jura;letter-spacing:-.02em}
  .dim{display:flex;align-items:center;gap:8px;font:600 13px Jura}
  .dim:before,.dim:after{content:"";flex:1;border-top:1px solid var(--line)}
  table.sp{width:100%;border-collapse:collapse;font:14px Jura}
  .sp th{border:1px solid var(--line);padding:6px;font-weight:700;text-align:center;font-size:12.5px}
  .sp td{border:1px solid var(--line);padding:5px 7px}
  .sp tr.on td{background:rgba(25,184,216,.22)} .sp tr.on td:first-child{box-shadow:inset 4px 0 0 var(--sky)}
  .sp td.r{text-align:right;font-variant-numeric:tabular-nums}
  .tep{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line)}
  .tep div{padding:16px 18px;border-right:1px solid var(--line)}
  .sig{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line)}
  .sig div{padding:12px 14px;border-right:1px solid var(--line);font-size:14px}
  .ok{color:var(--sky2)} .no{color:var(--red)}
  .clip{background:#f4f1ea;color:#1b1b1b;padding:22px 26px;transform:rotate(-.6deg);box-shadow:0 10px 30px rgba(0,0,0,.35);font-family:"PT Sans Narrow";display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
  .btn{display:inline-block;border:2px solid var(--sky);color:var(--sky2);padding:10px 16px;font:700 15px Jura;text-transform:uppercase;letter-spacing:.06em}
  svg text{font-family:Jura,sans-serif}
  @media(max-width:900px){.grid2,.tep,.sig,.clip{grid-template-columns:1fr}.stamp{position:static;width:100%;margin-top:14px}.sheet .in{padding-bottom:18px}.num{font-size:60px}}
</style>
</head>
<body>
<main class="wrap" id="app">Разворачиваем листы…</main>
<script src="_kit.js"></script>
<script>
const { num, int, sign, esc, unq, SHORT, QL, scale, path } = KIT;
const stamp = (title, sheet) => `<table class="stamp"><tr><td style="width:70px">Разраб.</td><td>Кабинет акима</td><td rowspan="3" class="t" style="width:190px">${title}</td></tr>
  <tr><td>Пров.</td><td>движок AQLS</td></tr><tr><td>Утв.</td><td>аким г. Астаны</td></tr>
  <tr><td>Стадия</td><td>П · 2027–2028</td><td class="t" style="font-size:12px">Лист ${sheet} · Листов 8</td></tr></table>`;
const sheet = (sec, n, title, body) => `<section data-sec="${sec}"><div class="sheet"><div class="in">${body}${stamp(title, n)}</div></div></section>`;
/* schematic district plan — conditional, not to scale */
const PLAN = {
  'Сарыарка': 'M60,40 L300,30 L320,170 L150,210 L50,160 Z',
  'Байконур': 'M300,30 L470,40 L480,150 L320,170 Z',
  'Алматы': 'M470,40 L640,70 L650,260 L500,250 L480,150 Z',
  'Есиль': 'M150,210 L320,170 L480,150 L500,250 L470,330 L230,340 Z',
  'Нура': 'M50,160 L150,210 L230,340 L160,420 L40,380 Z',
};
const CENT = { 'Сарыарка': [180, 115], 'Байконур': [395, 95], 'Алматы': [565, 160], 'Есиль': [345, 260], 'Нура': [125, 300] };
function planSvg(D, { cloud = false } = {}) {
  const byD = {}; D.decs.forEach((d) => { if (d.district) (byD[d.district] ||= []).push(d.measure); });
  return `<svg viewBox="0 0 700 460" width="100%" role="img" aria-label="Схема районов (условная)">
    <defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#19b8d8" stroke-width="2"/></pattern>
      <pattern id="h2" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="10" stroke="rgba(232,241,251,.35)" stroke-width="1"/></pattern></defs>
    ${D.districts.map((d) => `<path d="${PLAN[d.name]}" fill="${byD[d.name] ? 'url(#h)' : 'url(#h2)'}" fill-opacity="${byD[d.name] ? .55 : 1}" stroke="#e8f1fb" stroke-width="2"/>`).join('')}
    <path d="M20,250 C120,230 200,200 300,205 C400,210 470,205 560,280 C600,315 650,330 690,335" fill="none" stroke="#19b8d8" stroke-width="10" stroke-linecap="round" opacity=".9"/>
    <text x="600" y="355" font-size="13" fill="#7fdcef" font-style="italic">р. Есиль</text>
    ${D.districts.map((d) => { const [x, y] = CENT[d.name]; const ms = byD[d.name] || []; return `<text x="${x}" y="${y}" text-anchor="middle" font-size="17" font-weight="700" fill="#e8f1fb">${d.name.toUpperCase()}</text>
      <text x="${x}" y="${y + 18}" text-anchor="middle" font-size="12" fill="#e8f1fb">D ${num(d.Db)} → ${num(d.Da)} · ${Math.round(d.pop * 100)}%</text>
      ${ms.map((m, i) => `<g><circle cx="${x - (ms.length - 1) * 19 + i * 38}" cy="${y + 44}" r="16" fill="#0f3458" stroke="#19b8d8" stroke-width="2.5"/><text x="${x - (ms.length - 1) * 19 + i * 38}" y="${y + 48}" text-anchor="middle" font-size="11" font-weight="700" fill="#7fdcef">${m}</text></g>`).join('')}`; }).join('')}
    ${cloud ? `<path d="M40,60 q14,-18 30,0 q14,-18 30,0 q14,-18 30,0 q14,-18 30,0 q14,-18 30,0 q18,10 0,30 q18,14 0,30 q18,14 0,30 q18,14 0,30 q-14,18 -30,0 q-14,18 -30,0 q-14,18 -30,0 q-14,18 -30,0 q-14,18 -30,0 q-18,-14 0,-30 q-18,-14 0,-30 q-18,-14 0,-30 q-18,-14 0,-30 z" fill="none" stroke="#ff6b5b" stroke-width="2.5"/><text x="200" y="36" font-size="14" font-weight="700" fill="#ff6b5b">△1 смог: E2 −10</text>` : ''}
    <text x="10" y="450" font-size="11" fill="#e8f1fb" opacity=".7">Схема условная, без масштаба. Штриховка голубым — районные меры плана. Общегородские: M12.</text></svg>`;
}
function render(D) {
  const inPlan = Object.fromEntries(D.decs.map((d) => [d.measure, d]));
  const tl = D.timeline.map((t) => [t.q, t.score]);
  const secBars = () => { const W = 620, H = 250, bw = 70, gap = 50, sy = (v) => scale(v, 44, 66, H - 30, 10);
    return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="10" x2="${W - 10}" y1="${sy(44)}" y2="${sy(44)}" stroke="#e8f1fb" stroke-width="2"/>
      ${D.districts.map((d, i) => { const x = 30 + i * (bw + gap); return `<rect x="${x}" y="${sy(d.Db)}" width="${bw}" height="${sy(44) - sy(d.Db)}" fill="none" stroke="#e8f1fb" stroke-dasharray="4 3"/>
        <rect x="${x + 8}" y="${sy(d.Da)}" width="${bw - 16}" height="${sy(44) - sy(d.Da)}" fill="url(#hh)" stroke="#19b8d8" stroke-width="2"/>
        <text x="${x + bw / 2}" y="${sy(d.Da) - 8}" text-anchor="middle" font-size="13" font-weight="700" fill="#7fdcef">${num(d.Da, 1)}</text>
        <text x="${x + bw / 2}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#e8f1fb">${d.name}</text>`; }).join('')}
      <defs><pattern id="hh" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#19b8d8" stroke-width="1.5"/></pattern></defs></svg>`; };

  document.getElementById('app').innerHTML = [
    sheet('A Первый экран', 1, 'Генплан. Схема решений', `
      <div class="grid2"><div>${planSvg(D)}</div>
      <div><h2>Кабинет акима</h2><div class="note">Генеральный план решений, Астана, 2027–2028</div>
        <div style="margin-top:22px" class="dim">Score проекта</div><div class="num" style="text-align:center">${num(D.sc)}</div><div class="dim">старт ${num(D.base)} · ${sign(D.delta)}</div>
        <div style="margin-top:22px;border:1px solid var(--line);padding:12px 14px;font:15px Jura"><b>Примечание 1.</b> Перебраны все ${int(D.total)} законных варианта. Лучший — ${num(D.best.score)}: все районные меры в Нуре. Рейтинг акима по нему — <span class="no">${num(D.best.approval, 1)}%, ниже порога</span>. Проект по формуле не проходит выборы.</div>
        <div style="margin-top:10px;font:15px Jura">Место варианта: <b>${int(D.rank)}</b> из ${int(D.total)} · рейтинг <b class="ok">${num(D.appr, 1)}%</b></div></div></div>`),

    sheet('B Кабинет', 2, 'Ведомость мероприятий', `
      <h2>Ведомость мероприятий</h2><div class="note" style="margin-bottom:12px">Ровно 5 позиций · не более 2 по направлению · сумма ≤ 100</div>
      <div style="overflow-x:auto"><table class="sp"><tr><th>Поз.</th><th>Обозн.</th><th>Наименование</th><th>Направление</th><th>Эффект</th><th>Лаг, кв.</th><th>Привязка</th><th>Стоим.</th></tr>
        ${D.measures.map((m, i) => { const on = inPlan[m.id]; return `<tr class="${on ? 'on' : ''}"><td class="r">${i + 1}</td><td>${m.id}</td><td>${esc(m.name)}</td><td>${esc(D.DIR[m.direction].name)}</td><td>${Object.entries(m.effects).map(([k, v]) => `${k} ${v > 0 ? '+' : '−'}${Math.abs(v)}`).join(', ')}</td><td class="r">${m.lag}</td><td>${on ? (on.district || 'город') : m.type === 'district' ? '—' : 'город'}</td><td class="r">${m.cost}</td></tr>`; }).join('')}
        <tr><td colspan="7" style="text-align:right"><b>Итого по плану (отмечено голубым)</b> · остаток ${100 - D.cost} не сгорает и не даёт бонуса</td><td class="r"><b>${D.cost}</b></td></tr></table></div>
      <div style="margin-top:14px"><span class="btn">Принять решения</span> <span class="note" style="margin-left:10px">✓ проверка правил пройдена</span></div>`),

    sheet('C Вердикт', 3, 'ТЭП проекта', `
      <h2>Технико-экономические показатели</h2><div class="note" style="margin-bottom:14px">IV квартал 2028. Рейтинг акима — слой политического риска, не входит в Score.</div>
      <div class="tep"><div><div class="note">Score (AQLS)</div><div class="num" style="font-size:80px">${num(D.sc)}</div><div class="ok j">${sign(D.delta)} к ${num(D.base)}</div></div>
        <div><div class="note">Рейтинг акима</div><div class="num" style="font-size:80px">${num(D.appr, 1)}</div><div class="ok j">% · переизбран · порог 50</div></div>
        <div><div class="note">Счётчик сожаления</div><div class="j" style="font-size:22px;font-weight:700;margin-top:10px;line-height:1.3">максимум ${num(D.best.score)}, ваше место ${int(D.rank)} из ${int(D.total)}, топ ${num(D.top, 2)}%</div><div class="note" style="margin-top:6px">невыбрано ${num(D.gap)}</div></div></div>`),

    sheet('D Анализ', 4, 'Разрезы и профиль', `
      <div class="grid2"><div><h2>Разрез по районам</h2><div class="note">Пунктир — D до решений, штриховка — после.</div>${secBars()}</div>
        <div><h2>Продольный профиль</h2><div class="note">Score по кварталам, пикеты — кварталы.</div><svg viewBox="0 0 460 250" width="100%">${(() => { const sx = (q) => scale(q, 0, 8, 30, 440), sy = (v) => scale(v, 52, 57.5, 210, 15);
          return `${tl.map(([q, v]) => `<line x1="${sx(q)}" x2="${sx(q)}" y1="${sy(v)}" y2="215" stroke="rgba(232,241,251,.35)"/><text x="${sx(q)}" y="232" text-anchor="middle" font-size="10" fill="#e8f1fb">ПК${q}</text><text x="${sx(q)}" y="246" text-anchor="middle" font-size="9" fill="#7fdcef">${num(v, 1)}</text>`).join('')}
            <path d="${path(tl, sx, sy)}" fill="none" stroke="#19b8d8" stroke-width="3"/><line x1="30" x2="440" y1="${sy(D.best.score)}" y2="${sy(D.best.score)}" stroke="#ff6b5b" stroke-dasharray="8 5"/><text x="440" y="${sy(D.best.score) - 5}" text-anchor="end" font-size="11" fill="#ff6b5b">оптимум ${num(D.best.score)}</text>`; })()}</svg>
          <div class="note" style="margin-top:8px">Вклад позиций (без позиции Score упадёт на):</div>${D.contrib.map((c) => `<div class="j" style="display:grid;grid-template-columns:110px 1fr 50px;gap:8px;align-items:center;margin:5px 0;font-size:13px"><span>${c.measure} ${c.district || ''}</span><span style="height:10px;border:1px solid var(--line)"><span style="display:block;height:100%;width:${c.marginal / D.contrib[0].marginal * 100}%;background:var(--sky)"></span></span><b>+${num(c.marginal)}</b></div>`).join('')}</div></div>
      <div style="margin-top:18px;border:1px solid var(--line);padding:14px 16px"><div class="j" style="font-weight:700;font-size:16px">Пояснительная записка аналитика · ✓ числа сверены с движком</div>
        <p>${esc(D.ai.summary)}</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;font-size:14px">
        <div><b class="j">Сильные стороны</b>${D.ai.strengths.slice(0, 3).map((x) => `<p style="margin:4px 0">${esc(x)}</p>`).join('')}</div><div><b class="j">Риски</b>${D.ai.risks.map((x) => `<p style="margin:4px 0">${esc(x)}</p>`).join('')}</div><div><b class="j">Компромиссы</b>${D.ai.tradeoffs.slice(0, 2).map((x) => `<p style="margin:4px 0">${esc(x)}</p>`).join('')}</div></div>
        <p style="margin:10px 0 0"><b class="ok j">Рекомендация → ${num(D.ai.recommendation.expected_score)}.</b> ${esc(D.ai.recommendation.why)}</p></div>`),

    sheet('E Совет районов', 5, 'Лист согласований', `
      <h2>Лист согласований</h2><div class="note" style="margin-bottom:12px">Депутаты маслихата по районам.</div>
      <div class="sig">${D.councilPre.map((c) => `<div><b class="j" style="font-size:17px">${esc(c.district)}</b><div class="${c.mood === 'positive' ? 'ok' : 'no'} j" style="font-weight:700;margin:4px 0">${c.mood === 'positive' ? 'Согласовано' : c.mood === 'negative' ? 'Не согласовано' : 'С замечаниями'}</div><div class="note">ΔD ${sign(c.delta_D)} · ${num(c.approval, 0)}%</div><p style="margin:8px 0 10px">«${esc(unq(c.quote))}»</p><div style="border-bottom:1px solid var(--line);height:22px"></div><div class="note">подпись</div></div>`).join('')}</div>`),

    sheet('F Кризис', 6, 'Изменение № 1', `
      <div class="grid2"><div>${planSvg(D, { cloud: true })}</div>
        <div><h2 class="no">Изменение №1 · III кв.</h2><p style="font-size:16px">${esc(D.event.title)}. ${esc(D.event.description)}</p>
          <table class="sp"><tr><th>Изм.</th><th>Исключить</th><th>Включить</th><th>Score</th></tr><tr><td>△1</td><td>M12 Цифровая платформа</td><td>M4 Парк · Сарыарка</td><td class="r"><b>${num(D.res.score)}</b></td></tr></table>
          <div class="j" style="margin-top:12px;font-size:18px">${num(D.res.score_before_crisis)} → <span class="no">${num(D.res.score_after_crisis_no_swap)}</span> → <span class="ok">${num(D.res.score)}</span> <span class="note">(лучшая замена, ${sign(D.res.recovered)})</span></div>
          <div style="margin-top:12px;border:2px solid var(--red);padding:10px 12px;font:700 16px Jura" class="no">Рейтинг ${num(D.appr, 1)}% → ${num(D.res.approval.city, 1)}%: проект не утверждён, аким уволен.</div></div></div>`),

    sheet('G Газета', 7, 'Публикации', `<div class="clip"><div><div style="font:700 13px 'PT Sans Narrow';letter-spacing:.14em;text-transform:uppercase">Астана Times · ${esc(D.paper.date)}</div><div style="font:700 44px/1.05 Jura;margin:8px 0">${esc(D.paper.headlines[0].title)}</div><p style="font-size:17px">${esc(D.paper.headlines[0].lead)}</p><p style="font-style:italic;border-top:2px solid #1b1b1b;padding-top:8px">${esc(D.paper.editorial)}</p></div>
      <div>${D.paper.headlines.slice(1).map((h) => `<div style="padding:8px 0;border-bottom:1px solid #c9c4b8"><b style="font:700 17px Jura">${esc(h.title)}</b><div>${esc(h.lead)}</div></div>`).join('')}</div></div>`),

    sheet('H Лидерборд', 8, 'Сравнение вариантов', `<h2>Сравнение вариантов проекта</h2><div class="note" style="margin-bottom:12px">По Score. Графа «Решение» — по рейтингу акима.</div>
      <table class="sp"><tr><th>№</th><th>Вариант</th><th>Score</th><th>Рейтинг, %</th><th>Решение</th><th>Стоим.</th></tr>${D.board.map((r, i) => `<tr class="${r.pin === 'me' ? 'on' : ''}"><td class="r">${i + 1}</td><td>${esc(r.team)}${r.demo ? ' (пример)' : ''}</td><td class="r"><b>${num(r.score)}</b></td><td class="r">${num(r.approval, 1)}</td><td class="${r.approval < 50 ? 'no' : 'ok'}"><b>${r.approval < 50 ? 'не утверждён' : 'утверждён'}</b></td><td class="r">${r.cost}</td></tr>`).join('')}</table>`),
  ].join('');
}
KIT.load().then((D) => { render(D); KIT.tags(7); }).catch((e) => { document.getElementById('app').textContent = 'Нет данных: ' + e.message; });
</script>
</body>
</html>
