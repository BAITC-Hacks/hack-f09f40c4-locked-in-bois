<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>6 · Ночь выборов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@500;600;700;800&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#e9edf1;--ink:#0f1d2e;--mut:#5a6878;--sky:#19b8d8;--sky-d:#0a7891;--red:#d6352b;--panel:#fff;--line:#d3dae1}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.5 "Wix Madefor Text",system-ui,sans-serif}
  ::selection{background:var(--sky);color:#fff}
  .d{font-family:"Wix Madefor Display","Wix Madefor Text",sans-serif}
  .wrap{max-width:1320px;margin:0 auto;padding:0 24px 110px}
  section{margin-top:30px}
  .bug{display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;padding:12px 24px;font:700 15px "Wix Madefor Display";letter-spacing:.04em}
  .bug .live{background:var(--red);padding:3px 8px;border-radius:3px} .bug span:last-child{margin-left:auto;color:#9fb3c8;font-weight:500}
  .call{display:grid;grid-template-columns:1.25fr 1fr;gap:0;background:var(--panel);box-shadow:0 12px 30px rgba(15,29,46,.12)}
  .call .l{padding:30px 34px}
  .call .r{background:var(--ink);color:#fff;padding:26px 30px}
  .banner{display:inline-block;background:var(--sky);color:#04232b;padding:8px 14px;font:800 15px "Wix Madefor Display";letter-spacing:.06em;text-transform:uppercase}
  .big{font:800 112px/.9 "Wix Madefor Display";letter-spacing:-.04em;font-variant-numeric:tabular-nums}
  .h1{font:800 46px/1.02 "Wix Madefor Display";letter-spacing:-.02em;margin:14px 0 10px}
  .h1 em{font-style:normal;color:var(--red)}
  .cap{font:700 12px "Wix Madefor Display";letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
  .r .cap{color:#9fb3c8}
  h2{font:800 32px/1.05 "Wix Madefor Display";letter-spacing:-.02em;margin:0 0 4px}
  .sub{color:var(--mut);margin:0 0 14px}
  .panel{background:var(--panel);box-shadow:0 6px 18px rgba(15,29,46,.08);padding:20px}
  .prog{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-top:6px solid var(--sky)}
  .plank{background:#fff;padding:16px;border-right:1px solid var(--line)}
  .plank .no{font:800 44px/1 "Wix Madefor Display";color:var(--sky)}
  .cat{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:12px}
  .pr{background:#fff;padding:10px;font-size:13px;line-height:1.3;border-top:3px solid var(--line)}
  .pr.on{border-top-color:var(--sky);background:#eef9fc}
  .pr b{display:block;font:800 13px "Wix Madefor Display";color:var(--mut)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .res{display:grid;grid-template-columns:120px 1fr 70px;gap:12px;align-items:center;margin:10px 0}
  .res .track{height:30px;background:#eef1f4;position:relative}
  .res .track i{position:absolute;left:0;top:0;bottom:0}
  .res .track .mid{position:absolute;left:50%;top:-4px;bottom:-4px;border-left:2px dashed var(--ink)}
  .res b{font:800 20px "Wix Madefor Display";text-align:right}
  .corr{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .cc{background:#fff;box-shadow:0 6px 18px rgba(15,29,46,.08)}
  .cc .top{padding:10px 14px;color:#fff;font:800 16px "Wix Madefor Display";display:flex;justify-content:space-between}
  .cc p{padding:12px 14px;margin:0;font-size:14.5px}
  .breaking{background:var(--red);color:#fff;padding:26px 30px;display:grid;grid-template-columns:1fr 1fr;gap:30px}
  .paper{background:#fff;padding:30px 34px;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;box-shadow:0 12px 30px rgba(15,29,46,.12)}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th{font:700 12px "Wix Madefor Display";letter-spacing:.08em;text-transform:uppercase;color:var(--mut);text-align:right;padding:10px;border-bottom:3px solid var(--ink)}
  td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--line);font-size:16px}
  th:nth-child(2),td:nth-child(2){text-align:left}
  .ticker{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:4px solid var(--sky);font:600 15px "Wix Madefor Text";box-shadow:0 -6px 20px rgba(15,29,46,.12)}
  .ticker b{background:var(--ink);color:#fff;padding:12px 16px;white-space:nowrap;font-family:"Wix Madefor Display"}
  .ticker div{white-space:nowrap;overflow:hidden;padding:12px 16px}
  .ticker div span{display:inline-block;animation:crawl 60s linear infinite}
  @keyframes crawl{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion:reduce){.ticker div span{animation:none}}
  body.kit-shot .ticker{position:static}
  @media(max-width:900px){.call,.grid3,.breaking,.paper,.prog,.corr{grid-template-columns:1fr}.cat{grid-template-columns:1fr 1fr}.big{font-size:72px}.h1{font-size:30px}}
</style>
</head>
<body>
<div class="bug"><span class="live">В ЭФИРЕ</span><span>ВЫБОРЫ АКИМА АСТАНЫ · ИТОГИ СРОКА 2027–2028</span><span>обработано 694 395 из 694 395 планов</span></div>
<main class="wrap" id="app">Подсчёт голосов…</main>
<div class="ticker" id="ticker"></div>
<script src="_kit.js"></script>
<script>
const { num, int, sign, esc, unq, SHORT, QL, scale, path } = KIT;
function hemicycle(pct) {
  const seats = [], rows = [12, 16, 20, 24, 28];
  rows.forEach((n, ri) => { const R = 70 + ri * 22; for (let i = 0; i < n; i++) { const a = Math.PI * (1 - i / (n - 1)); seats.push({ x: 200 + R * Math.cos(a), y: 190 - R * Math.sin(a), a }); } });
  seats.sort((p, q) => q.a - p.a);
  const k = Math.round(seats.length * pct / 100);
  return `<svg viewBox="0 0 400 200" width="100%">${seats.map((s, i) => `<circle cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" r="6.5" fill="${i < k ? '#19b8d8' : '#d6352b'}"/>`).join('')}
    <line x1="200" x2="200" y1="40" y2="196" stroke="#fff" stroke-width="3"/><text x="200" y="192" text-anchor="middle" font-family="Wix Madefor Display" font-weight="800" font-size="30" fill="#fff">${num(pct, 1)}%</text></svg>`;
}
function render(D) {
  const inPlan = Object.fromEntries(D.decs.map((d) => [d.measure, d]));
  const tl = D.timeline.map((t) => [t.q, t.score]);
  document.getElementById('app').innerHTML = `
  <section data-sec="A Первый экран" style="margin-top:26px">
    <div class="call">
      <div class="l"><span class="banner">Прогноз подтверждён · переизбран</span>
        <h1 class="h1">Аким остаётся с ${num(D.appr, 1)}%. <em>Идеальный по формуле аким проиграл бы: ${num(D.best.approval, 1)}%.</em></h1>
        <p style="font-size:18px;color:var(--mut);margin:0">Движок пересчитал все ${int(D.total)} законных плана. Лучший даёт Score ${num(D.best.score)}, но отдаёт все районные меры одной Нуре.</p>
        <div style="display:flex;gap:40px;margin-top:22px;flex-wrap:wrap"><div><div class="cap">Score (AQLS)</div><div class="big">${num(D.sc)}</div></div><div><div class="cap">Место среди планов</div><div class="big" style="font-size:64px;margin-top:22px">${int(D.rank)}</div><div class="cap">из ${int(D.total)} · топ ${num(D.top, 2)}%</div></div></div></div>
      <div class="r"><div class="cap">Рейтинг акима · 100 мест по долям поддержки</div>${hemicycle(D.appr)}
        <div style="display:flex;justify-content:space-between;font:700 14px 'Wix Madefor Display'"><span style="color:#7fd8ea">за · ${num(D.appr, 1)}%</span><span>порог 50%</span><span style="color:#ff9a90">против · ${num(100 - D.appr, 1)}%</span></div>
        <p style="font-size:13px;color:#9fb3c8;margin:12px 0 0">Рейтинг — слой политического риска, не входит в Score.</p></div>
    </div>
  </section>

  <section data-sec="B Кабинет">
    <h2>Предвыборная программа</h2><p class="sub">Пять пунктов из четырнадцати. Не больше двух в одном направлении. Смета — 100 единиц.</p>
    <div class="prog">${D.decs.map((d, i) => `<div class="plank"><div class="no">${i + 1}</div><b class="d" style="font-size:16px">${esc(d.m.name)}</b><div style="color:var(--mut);font-size:13px;margin-top:4px">${d.measure} · ${d.district || 'весь город'} · ${d.m.cost} ед. · лаг ${d.m.lag}</div></div>`).join('')}</div>
    <div class="cat">${D.measures.map((m) => `<div class="pr ${inPlan[m.id] ? 'on' : ''}"><b>${m.id} · ${m.cost} ед.</b>${esc(m.name)}<div style="color:var(--mut);font-size:12px;margin-top:3px">${esc(D.DIR[m.direction].name)}</div></div>`).join('')}</div>
    <div class="panel" style="margin-top:12px;display:flex;align-items:center;gap:20px;flex-wrap:wrap"><div style="flex:1;min-width:260px"><div class="cap">Смета · ${D.cost} из 100</div><div style="height:14px;background:#eef1f4;margin-top:6px"><div style="height:100%;width:${D.cost}%;background:var(--sky)"></div></div><div style="font-size:13px;color:var(--mut);margin-top:4px">остаток ${100 - D.cost} не сгорает и не даёт бонуса · программа допустима</div></div>
      <span class="banner" style="padding:12px 20px">Принять решения</span></div>
  </section>

  <section data-sec="C Вердикт">
    <div class="grid3">
      <div class="panel"><div class="cap">Score (AQLS)</div><div class="big" style="font-size:86px">${num(D.sc)}</div><div style="font:700 18px 'Wix Madefor Display';color:var(--sky-d)">${sign(D.delta)} к ${num(D.base)}</div></div>
      <div class="panel"><div class="cap">Счётчик сожаления</div><div class="d" style="font-size:24px;font-weight:700;line-height:1.25;margin-top:10px">максимум ${num(D.best.score)}, ваше место ${int(D.rank)} из ${int(D.total)}, топ ${num(D.top, 2)}%</div><div style="color:var(--mut);margin-top:8px">На столе осталось ${num(D.gap)}.</div></div>
      <div class="panel" style="border-top:6px solid var(--red)"><div class="cap">Главный сюжет ночи</div><div class="d" style="font-size:24px;font-weight:700;line-height:1.25;margin-top:10px">Оптимум ${num(D.best.score)} → рейтинг ${num(D.best.approval, 1)}%: уволен</div><div style="color:var(--mut);margin-top:8px">Баланс: ${num(D.balanced.score)} при ${num(D.balanced.approval, 1)}% — переизбран.</div></div>
    </div>
  </section>

  <section data-sec="D Анализ">
    <h2>Результаты по районам</h2><p class="sub">Поддержка акима в районе и рост индекса D. Пунктир — порог 50%.</p>
    <div class="grid3" style="grid-template-columns:1.3fr 1fr">
      <div class="panel">${D.districts.map((d) => `<div class="res"><div><b class="d" style="font-size:17px;text-align:left;display:block">${esc(d.name)}</b><span style="font-size:12px;color:var(--mut)">${Math.round(d.pop * 100)}% · D ${num(d.Db)} → ${num(d.Da)}</span></div><div class="track"><i style="width:${d.approval}%;background:${d.approval >= 50 ? 'var(--sky)' : 'var(--red)'}"></i><span class="mid"></span></div><b style="color:${d.approval >= 50 ? 'var(--sky-d)' : 'var(--red)'}">${num(d.approval, 0)}%</b></div>`).join('')}</div>
      <div class="panel"><div class="cap">Кривая Score за срок</div><svg viewBox="0 0 420 220" width="100%">${(() => { const sx = (q) => scale(q, 0, 8, 30, 410), sy = (v) => scale(v, 52, 57.5, 195, 15);
        return `<path d="${path(tl, sx, sy)} L${sx(8)},195 L${sx(0)},195 Z" fill="#dff4f9"/><path d="${path(tl, sx, sy)}" fill="none" stroke="#19b8d8" stroke-width="4"/><line x1="30" x2="410" y1="${sy(D.best.score)}" y2="${sy(D.best.score)}" stroke="#d6352b" stroke-width="2" stroke-dasharray="6 5"/>
          <text x="410" y="${sy(D.best.score) - 6}" text-anchor="end" font-size="12" font-weight="700" fill="#d6352b" font-family="Wix Madefor Display">оптимум ${num(D.best.score)}</text>${[0, 4, 8].map((q) => `<text x="${sx(q)}" y="214" font-size="11" text-anchor="middle" fill="#5a6878">${QL[q]}</text>`).join('')}`; })()}</svg>
        <div class="cap" style="margin-top:12px">Вклад каждой меры</div>${D.contrib.map((c) => `<div style="display:grid;grid-template-columns:120px 1fr 50px;gap:8px;align-items:center;margin:6px 0;font-size:13px"><span>${c.measure} ${c.district || ''}</span><div style="height:12px;background:#eef1f4"><div style="height:100%;width:${c.marginal / D.contrib[0].marginal * 100}%;background:var(--ink)"></div></div><b>+${num(c.marginal)}</b></div>`).join('')}</div>
    </div>
    <div class="panel" style="margin-top:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px">${[['Сильные стороны', D.ai.strengths], ['Риски', D.ai.risks], ['Последствия', D.ai.consequences], ['Компромиссы', D.ai.tradeoffs]].map(([t, xs]) => `<div><div class="cap" style="color:var(--ink)">${t}</div>${xs.slice(0, 3).map((x) => `<p style="font-size:14px;margin:6px 0">${esc(x)}</p>`).join('')}</div>`).join('')}</div>
    <div class="panel" style="margin-top:12px;border-left:0;border-top:5px solid var(--sky)"><b class="d">Студийный аналитик рекомендует → ${num(D.ai.recommendation.expected_score)}.</b> ${esc(D.ai.recommendation.why)} <span style="color:var(--mut)">✓ числа сверены с движком</span></div>
  </section>

  <section data-sec="E Совет районов">
    <h2>Корреспонденты в районах</h2><p class="sub">Депутаты маслихата в прямом эфире.</p>
    <div class="corr">${D.councilPre.map((c) => `<div class="cc"><div class="top" style="background:${c.mood === 'positive' ? 'var(--sky-d)' : c.mood === 'negative' ? 'var(--red)' : 'var(--mut)'}"><span>${esc(c.district)}</span><span>${c.mood === 'positive' ? 'ЗА' : c.mood === 'negative' ? 'ПРОТИВ' : 'ВОЗД.'}</span></div><p>«${esc(unq(c.quote))}»</p><p style="padding-top:0;color:var(--mut);font-size:13px">ΔD ${sign(c.delta_D)} · поддержка ${num(c.approval, 0)}%</p></div>`).join('')}</div>
  </section>

  <section data-sec="F Кризис">
    <div class="breaking">
      <div><span style="background:#fff;color:var(--red);padding:4px 10px;font:800 14px 'Wix Madefor Display';letter-spacing:.08em">СРОЧНО · III КВАРТАЛ</span><div class="h1" style="color:#fff;font-size:56px">${esc(D.event.title)}</div><p style="font-size:17px;margin:0">${esc(D.event.description)}</p></div>
      <div style="background:rgba(255,255,255,.12);padding:20px"><div class="cap" style="color:#ffd9d5">Экстренная замена</div><div class="d" style="font-size:36px;font-weight:800;margin:6px 0 10px">M12 → M4 Сарыарка</div>
        <div class="d" style="font-size:26px;font-weight:800">${num(D.res.score_before_crisis)} → ${num(D.res.score_after_crisis_no_swap)} → ${num(D.res.score)}</div><div style="font-size:14px">лучшая из возможных замен: ${sign(D.res.recovered)}</div>
        <div style="background:#fff;color:var(--red);padding:12px 14px;margin-top:14px;font:800 22px 'Wix Madefor Display'">ПЕРЕСЧЁТ: ${num(D.res.approval.city, 1)}% — АКИМ УВОЛЕН</div></div>
    </div>
  </section>

  <section data-sec="G Газета">
    <div class="paper"><div><div class="cap">Астана Times · утро после выборов · ${esc(D.paper.date)}</div><div class="h1" style="font-size:52px">${esc(D.paper.headlines[0].title)}</div><p style="font-size:18px">${esc(D.paper.headlines[0].lead)}</p><p style="font-style:italic;border-top:3px solid var(--ink);padding-top:12px">${esc(D.paper.editorial)}</p></div>
      <div>${D.paper.headlines.slice(1).map((h) => `<div style="padding:12px 0;border-bottom:1px solid var(--line)"><b class="d" style="font-size:19px">${esc(h.title)}</b><div style="font-size:14.5px">${esc(h.lead)}</div></div>`).join('')}</div></div>
  </section>

  <section data-sec="H Лидерборд">
    <h2>Таблица кандидатов</h2><p class="sub">Сортировка по Score. Столбец «Итог» — по рейтингу.</p>
    <div class="panel" style="padding:6px 16px"><table><tr><th>#</th><th>Кандидат</th><th>Score</th><th>Рейтинг</th><th>Итог</th><th>Смета</th></tr>${D.board.map((r, i) => `<tr style="${r.pin === 'me' ? 'background:#eef9fc' : ''}"><td class="d"><b>${i + 1}</b></td><td>${esc(r.team)}${r.demo ? ' <span style="color:var(--mut);font-size:12px">(пример)</span>' : ''}</td><td class="d"><b>${num(r.score)}</b></td><td>${num(r.approval, 1)}%</td><td><span class="banner" style="font-size:12px;padding:4px 8px;${r.approval < 50 ? 'background:var(--red);color:#fff' : ''}">${r.approval < 50 ? 'уволен' : 'переизбран'}</span></td><td>${r.cost}</td></tr>`).join('')}</table></div>
  </section>`;
  const items = [...D.paper.headlines.map((h) => h.title), `Score ${num(D.sc)}`, `оптимум ${num(D.best.score)} — рейтинг ${num(D.best.approval, 1)}%`, `место ${int(D.rank)} из ${int(D.total)}`].map(esc).join(' &nbsp;•&nbsp; ');
  document.getElementById('ticker').innerHTML = `<b>ЛЕНТА</b><div><span>${items} &nbsp;•&nbsp; ${items} &nbsp;•&nbsp;</span></div>`;
}
KIT.load().then((D) => { render(D); KIT.tags(6); }).catch((e) => { document.getElementById('app').textContent = 'Нет данных: ' + e.message; });
</script>
</body>
</html>
