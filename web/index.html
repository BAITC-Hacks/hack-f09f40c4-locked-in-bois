<div id="modal" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/70 p-0 backdrop-blur-sm sm:items-center sm:p-6"></div>
<div id="toast" class="pointer-events-none fixed bottom-24 left-1/2 z-[60] -translate-x-1/2 lg:bottom-8"></div>

<script>
'use strict';
/* =====================================================================
   CONFIG — the ONE place to point the page at a backend.
   ?mock=1        → use web/mock/ (dataset.json + engine.js) instead of the API
   ?api=https://… → API base URL (default: same origin as the page)
   ?session=room1 → leaderboard room (QR audience)
   ===================================================================== */
const QS = new URLSearchParams(location.search);
const CONFIG = {
  API_BASE: (QS.get('api') || '').replace(/\/$/, ''),
  MOCK: QS.get('mock') === '1',
  SESSION: (QS.get('session') || '').slice(0, 40),
  TIMEOUT_MS: 12000,
};

/* ---------------- tiny helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (x, d = 2) => (x == null || isNaN(x) ? '—' : Number(x).toFixed(d).replace('.', ','));
const int = (x) => (x == null || isNaN(x) ? '—' : Math.round(Number(x)).toLocaleString('ru-RU'));
const sign = (x, d = 2) => (x == null || isNaN(x) ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '±') + num(Math.abs(x), d));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? few : many; };
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = `<div class="fade-in rounded-xl border border-base-600 bg-base-800 px-4 py-2.5 text-sm shadow-2xl">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.innerHTML = ''), 2600);
}
function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
const skel = (h = 'h-24', extra = '') => `<div class="skel ${h} ${extra}"></div>`;
const spinner = (t = 'Загрузка…') => `<span class="inline-flex items-center gap-2 text-slate-400"><span class="spin"></span>${esc(t)}</span>`;

/* ---------------- API layer ---------------- */
let MOCK = null;           // mock engine instance
let SOURCE = null;         // 'api' | 'mock'
async function getMock() {
  if (MOCK) return MOCK;
  if (!window.MockEngine) await loadScript('mock/engine.js');
  const ds = await fetch('mock/dataset.json').then((r) => r.json());
  await sleep(0);
  MOCK = window.MockEngine.create(ds);
  return MOCK;
}
const LB_KEY = 'akim2028.leaderboard';
function lbLoad() {
  try { const x = JSON.parse(localStorage.getItem(LB_KEY)); if (Array.isArray(x)) return x; } catch (e) {}
  const now = Date.now();
  return [
    { team: 'Оптимум (перебор всех планов)', aqls: 57.24, approval: 49.19, budget_used: 100, session: '', ts: now - 9e5, reelected: false },
    { team: 'Байтерек', aqls: 56.41, approval: 63.2, budget_used: 97, session: '', ts: now - 8e5, reelected: true },
    { team: 'Нурлы жол', aqls: 55.87, approval: 58.1, budget_used: 92, session: '', ts: now - 7e5, reelected: true },
    { team: 'Хан Шатыр', aqls: 54.62, approval: 51.4, budget_used: 81, session: '', ts: now - 6e5, reelected: true },
    { team: 'Акорда', aqls: 53.95, approval: 46.8, budget_used: 100, session: '', ts: now - 5e5, reelected: false },
  ];
}
function lbSave(x) { try { localStorage.setItem(LB_KEY, JSON.stringify(x)); } catch (e) {} }

async function mockCall(method, path, body) {
  const e = await getMock();
  await sleep(180 + Math.random() * 220); // feel like a network
  const decs = body && body.decisions;
  if (path === '/api/dataset') return e.dataset;
  if (path === '/api/validate') return e.validate(decs, { budget: body.budget_limit });
  if (path === '/api/evaluate') return e.verdict(decs);
  if (path === '/api/narrative') return e.narrative(decs, body.verdict);
  if (path === '/api/shock') return e.shock(decs);
  if (path === '/api/shock/resolve') return e.resolve(body);
  if (path.startsWith('/api/leaderboard')) {
    const all = lbLoad();
    if (method === 'POST') {
      const v = e.verdict(decs);
      const row = { team: body.team, session: body.session || '', aqls: v.aqls, approval: v.approval, budget_used: v.budget_used, reelected: v.reelected, ts: Date.now() };
      all.push(row); lbSave(all); return row;
    }
    const s = new URL(path, location.href).searchParams.get('session') || '';
    return { session: s, entries: all.filter((r) => (r.session || '') === s).sort((a, b) => b.aqls - a.aqls) };
  }
  throw new Error('mock: unknown path ' + path);
}

async function api(method, path, body) {
  if (SOURCE === 'mock') return mockCall(method, path, body);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), CONFIG.TIMEOUT_MS);
  try {
    const r = await fetch(CONFIG.API_BASE + path, {
      method, signal: ctl.signal,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) { let detail = ''; try { detail = (await r.json()).detail; } catch (e) {} throw new Error(`HTTP ${r.status}${detail ? ': ' + (typeof detail === 'string' ? detail : JSON.stringify(detail)) : ''}`); }
    return await r.json();
  } finally { clearTimeout(timer); }
}

/* ---------------- dataset normalisation (tolerant to backend naming) ---------------- */
function normalizeDataset(raw) {
  const ds = { ...raw };
  ds.budget = raw.budget ?? raw.budget_total ?? 100;
  ds.slots = raw.slots ?? raw.max_decisions ?? 5;
  ds.max_per_direction = raw.max_per_direction ?? raw.direction_limit ?? 2;
  ds.quarters = raw.quarters ?? 8;
  ds.baseline_aqls = raw.baseline_aqls ?? raw.baseline ?? 52.56;
  ds.max_aqls = raw.max_aqls ?? 57.24;
  ds.total_plans = raw.total_plans ?? 694395;
  ds.reelection_threshold = raw.reelection_threshold ?? 50;
  ds.directions = (raw.directions || []).map((d) => (typeof d === 'string' ? { id: d, name: d } : { id: d.id, name: d.name ?? d.title ?? d.id }));
  ds.districts = (raw.districts || []).map((d) => (typeof d === 'string' ? { id: d, name: d } : { ...d, name: d.name ?? d.title ?? d.id }));
  ds.measures = (raw.measures || []).map((m) => ({
    ...m,
    direction: m.direction ?? m.direction_id,
    cost: m.cost ?? m.price,
    lag: m.lag ?? m.lag_quarters ?? 0,
    scope: m.scope ?? (m.district_level || m.is_district ? 'district' : 'city'),
    effects: Array.isArray(m.effects) ? Object.fromEntries(m.effects.map((e) => [e.metric ?? e.direction ?? e.name, e.value ?? e.delta])) : (m.effects || {}),
  }));
  if (!ds.directions.length) ds.directions = [...new Set(ds.measures.map((m) => m.direction))].map((id) => ({ id, name: id }));
  return ds;
}

/* ---------------- state ---------------- */
const S = {
  ds: null, slots: [], validation: null, validating: false, valSeq: 0,
  verdict: null, verdictLoading: false, verdictError: null,
  narrative: null, narrativeLoading: false, narrativeError: null,
  crisis: null, crisisResolved: null,
  tab: 'cabinet',
};
const M = () => Object.fromEntries(S.ds.measures.map((m) => [m.id, m]));
const DIR = () => Object.fromEntries(S.ds.directions.map((d) => [d.id, d]));
const DIST = () => Object.fromEntries(S.ds.districts.map((d) => [d.id, d]));
const decisions = () => S.slots.filter(Boolean).map((s) => ({ measure_id: s.measure_id, district_id: s.district_id || null }));
const decLabel = (d) => { const m = M()[d.measure_id]; if (!m) return d.measure_id; const k = d.district_id && DIST()[d.district_id]; return k ? `${m.name} · ${k.name}` : m.name; };
const SHORT = { eco: 'экология', transport: 'транспорт', health: 'здоровье', edu: 'образование', housing: 'ЖКХ' };
const shortDir = (id) => SHORT[id] || (DIR()[id] ? DIR()[id].name.toLowerCase() : id);

/* ---------------- tabs ---------------- */
const TABS = [
  { id: 'cabinet', name: 'Кабинет акима' },
  { id: 'verdict', name: 'Вердикт' },
  { id: 'paper', name: 'Астана Times' },
  { id: 'board', name: 'Лидерборд' },
];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map((t) => `<button role="tab" data-go="${t.id}" aria-selected="${S.tab === t.id}"
    class="tab-btn whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-400 hover:text-white">${t.name}</button>`).join('');
}
function go(tab, push = true) {
  S.tab = tab;
  $$('main > section').forEach((s) => (s.hidden = s.dataset.tab !== tab));
  $('#mobileBar').hidden = tab !== 'cabinet';
  renderTabs();
  if (tab === 'verdict') renderVerdict();
  if (tab === 'paper') renderPaper();
  if (tab === 'board') startBoard(); else stopBoard();
  if (push) history.replaceState(null, '', location.pathname + location.search + '#' + tab);
  window.scrollTo(0, 0);
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

/* =====================================================================
   КАБИНЕТ АКИМА
   ===================================================================== */
function renderCabinetShell() {
  $('#tab-cabinet').innerHTML = `
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <div class="card-h mb-1">Кабинет акима · I кв. 2027</div>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Пять решений. Сто единиц. Два года до выборов.</h1>
        <p class="mt-1.5 max-w-2xl text-sm text-slate-400">Выберите пять мер: не больше двух в одном направлении, бюджет не больше 100. Районные меры привязываются к одному району.</p>
      </div>
      <div class="flex gap-2">
        <button id="btnExample" class="rounded-lg border border-base-600 px-3 py-2 text-sm text-slate-200 hover:border-accent hover:text-white">Пример из ТЗ</button>
        <button id="btnClear" class="rounded-lg border border-base-700 px-3 py-2 text-sm text-slate-400 hover:text-white">Очистить</button>
      </div>
    </div>
    <div class="grid gap-6 lg:grid-cols-[1fr_340px]">
      <div id="measures" class="space-y-7">${skel('h-40')}${skel('h-40')}${skel('h-40')}</div>
      <aside id="rail" class="lg:sticky lg:top-20 lg:self-start">${skel('h-96')}</aside>
    </div>`;
  $('#btnExample').onclick = () => { if (!S.ds) return; loadPlan(S.ds.example_plan || []); toast('Загружен пример из ТЗ'); };
  $('#btnClear').onclick = () => { if (!S.ds) return; S.slots = Array(S.ds.slots).fill(null); onPlanChange(); };
}

function planState() {
  const ms = M();
  const used = S.slots.filter(Boolean).reduce((s, x) => s + (ms[x.measure_id]?.cost || 0), 0);
  const counts = Object.fromEntries(S.ds.directions.map((d) => [d.id, 0]));
  S.slots.filter(Boolean).forEach((x) => { const m = ms[x.measure_id]; if (m) counts[m.direction] = (counts[m.direction] || 0) + 1; });
  const filled = S.slots.filter(Boolean).length;
  return { used, left: S.ds.budget - used, over: used > S.ds.budget, counts, filled, full: filled >= S.ds.slots };
}

function renderMeasures() {
  const ps = planState();
  const inPlan = Object.fromEntries(S.slots.map((s, i) => s && [s.measure_id, { ...s, slot: i }]).filter(Boolean));
  const html = S.ds.directions.map((d) => {
    const list = S.ds.measures.filter((m) => m.direction === d.id);
    const cnt = ps.counts[d.id] || 0;
    const dirFull = cnt >= S.ds.max_per_direction;
    return `<div>
      <div class="mb-3 flex items-center gap-3">
        <h2 class="text-base font-semibold">${esc(d.name)}</h2>
        <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold ${dirFull ? 'bg-accent/15 text-accent' : 'bg-base-800 text-slate-400'}">${cnt}/${S.ds.max_per_direction}</span>
        <div class="h-px flex-1 bg-base-700"></div>
      </div>
      <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
      ${list.map((m) => {
        const sel = inPlan[m.id];
        let reason = '';
        if (!sel) { if (ps.full) reason = 'Все 5 слотов заняты'; else if (dirFull) reason = `В направлении уже ${S.ds.max_per_direction} решения`; }
        const eff = Object.entries(m.effects || {}).map(([k, v]) => `<span class="rounded-md bg-base-800 px-1.5 py-0.5 text-[11px] text-slate-300">${v > 0 ? '+' : ''}${esc(String(v).replace('.', ','))} ${esc(shortDir(k))}</span>`).join('');
        const distName = sel && sel.district_id && DIST()[sel.district_id] ? DIST()[sel.district_id].name : '';
        return `<button class="measure card relative flex flex-col gap-2 p-4 text-left" data-mid="${esc(m.id)}" data-selected="${!!sel}" ${reason ? `disabled title="${esc(reason)}"` : ''}>
          <div class="flex items-start justify-between gap-2">
            <span class="rounded-md px-1.5 py-0.5 text-[10.5px] font-semibold uppercase tracking-wider ${m.scope === 'district' ? 'bg-amber-400/10 text-amber-300' : 'bg-accent/10 text-accent'}">${m.scope === 'district' ? 'Район' : 'Город'}</span>
            <span class="text-right"><span class="text-xl font-bold tabular-nums">${esc(m.cost)}</span><span class="ml-0.5 text-xs text-slate-400">ед.</span></span>
          </div>
          <div class="font-semibold leading-snug">${esc(m.name)}</div>
          ${m.description ? `<div class="text-[13px] leading-snug text-slate-400">${esc(m.description)}</div>` : ''}
          <div class="mt-auto flex flex-wrap items-center gap-1.5 pt-1">
            <span class="rounded-md border border-base-600 px-1.5 py-0.5 text-[11px] text-slate-300">эффект через ${esc(m.lag)} кв.</span>${eff}
          </div>
          ${sel ? `<div class="absolute -right-2 -top-2 rounded-full bg-accent px-2 py-0.5 text-[11px] font-bold text-base-950 shadow-lg">Слот ${sel.slot + 1}${distName ? ' · ' + esc(distName) : ''}</div>` : ''}
        </button>`;
      }).join('')}
      </div></div>`;
  }).join('');
  $('#measures').innerHTML = html;
  $$('#measures [data-mid]').forEach((b) => (b.onclick = () => pickMeasure(b.dataset.mid)));
}

function renderRail() {
  const ps = planState();
  const v = S.validation;
  const ms = M();
  const pct = Math.min(100, (ps.used / S.ds.budget) * 100);
  const canSubmit = v && v.valid && !ps.over && !S.validating && ps.full;
  let msg;
  if (S.validating && !v) msg = `<div class="text-sm">${spinner('Проверяем план…')}</div>`;
  else if (ps.over) msg = `<div class="flex gap-2 text-sm text-red-300"><b>!</b><span>Перерасход: ${ps.used} из ${S.ds.budget}. Уберите одну из дорогих мер.</span></div>`;
  else if (v) msg = `<div class="flex items-start gap-2 text-sm ${v.valid ? 'text-emerald-300' : 'text-amber-200'}">
      <span class="mt-0.5 grid h-4 w-4 shrink-0 place-items-center rounded-full ${v.valid ? 'bg-emerald-400/20' : 'bg-amber-400/20'} text-[10px] font-bold">${v.valid ? '✓' : '!'}</span>

        <div class="mt-1.5 text-[12px] ${ps.over ? 'text-red-400' : 'text-slate-400'}">${ps.over ? `Перерасход на ${ps.used - S.ds.budget} ед.` : `Остаток ${ps.left} ед. — <span class="text-slate-300">не сгорает и не даёт бонуса</span>`}</div>

      <div class="mt-5 grid grid-cols-5 gap-1.5">
        ${S.ds.directions.map((d) => { const c = ps.counts[d.id] || 0; const over = c > S.ds.max_per_direction; return `
          <div class="rounded-lg border ${over ? 'border-red-500/60' : c ? 'border-accent/40' : 'border-base-700'} px-1 py-1.5 text-center" title="${esc(d.name)}">

    </div>`;
  $$('#rail [data-remove]').forEach((b) => (b.onclick = () => { S.slots[+b.dataset.remove] = null; onPlanChange(); }));
  $('#btnSubmit').onclick = submitPlan;

  $('#mobileBar').innerHTML = `
    <div class="flex items-center gap-3">
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline gap-2 text-sm"><b class="tabular-nums ${ps.over ? 'text-red-400' : ''}">${ps.used}/${S.ds.budget}</b><span class="text-slate-400">· ${ps.filled}/${S.ds.slots} решений</span></div>
        <div class="mt-1 h-1.5 overflow-hidden rounded-full bg-base-800"><div class="h-full ${ps.over ? 'bg-red-500' : 'bg-accent'}" style="width:${pct}%"></div></div>

      </div>
      <button id="btnSubmitM" class="shrink-0 rounded-xl px-4 py-3 text-sm font-bold ${canSubmit ? 'bg-accent text-base-950' : 'bg-base-800 text-slate-500'}" ${canSubmit ? '' : 'disabled'}>Принять</button>
    </div>`;
  $('#btnSubmitM').onclick = submitPlan;
}

function pickMeasure(mid) {
  const m = M()[mid];
  const idx = S.slots.findIndex((s) => s && s.measure_id === mid);
  if (idx >= 0) { S.slots[idx] = null; onPlanChange(); return; }
  const free = S.slots.findIndex((s) => !s);
  if (free < 0) { toast('Все пять слотов заняты — уберите одно решение'); return; }
  if (m.scope === 'district') {
    openDistrictPicker(m, (districtId) => { S.slots[free] = { measure_id: mid, district_id: districtId }; onPlanChange(); });
  } else { S.slots[free] = { measure_id: mid, district_id: null }; onPlanChange(); }
}

function openDistrictPicker(m, onPick) {
  const dirId = m.direction;
  openModal(`
    <div class="card fade-in w-full max-w-lg rounded-b-none p-5 sm:rounded-2xl">
      <div class="card-h">Районная мера · ${esc(m.cost)} ед.</div>
      <h3 class="mt-1 text-lg font-bold">${esc(m.name)}</h3>
      <p class="mt-1 text-sm text-slate-400">В каком районе запускаем? Меньше индекс — сильнее эффект на месте. Больше жителей — больше вклад в AQLS.</p>
      <div class="mt-4 space-y-2">
        ${S.ds.districts.map((k) => {
          const idx = k.indices && k.indices[dirId];
          const low = idx != null && idx < 40;
          return `<button data-pick="${esc(k.id)}" class="flex w-full items-center gap-3 rounded-xl border border-base-700 bg-base-850 px-3 py-3 text-left hover:border-accent">
            <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-base-800 text-xs font-bold">${esc((k.name || '').slice(0, 2))}</span>
            <span class="min-w-0 flex-1"><span class="block font-semibold">${esc(k.name)}</span>
              <span class="block text-[12px] text-slate-400">${k.population ? int(k.population) + ' жителей · ' : ''}AQLS ${num(k.aqls)}</span></span>
            ${idx != null ? `<span class="text-right"><span class="block text-[10px] uppercase tracking-wider text-slate-500">${esc(shortDir(dirId))}</span><span class="font-bold tabular-nums ${low ? 'text-red-400' : ''}">${esc(idx)}</span></span>` : ''}
          </button>`;
        }).join('')}
      </div>
      <button data-close class="mt-4 w-full rounded-xl border border-base-700 py-2.5 text-sm text-slate-400 hover:text-white">Отмена</button>
    </div>`);
  $$('#modal [data-pick]').forEach((b) => (b.onclick = () => { closeModal(); onPick(b.dataset.pick); }));
}

function openModal(html, { dismissable = true } = {}) {
  const md = $('#modal');
  md.innerHTML = html; md.classList.remove('hidden'); md.classList.add('flex');
  md.onclick = (e) => { if ((dismissable && e.target === md) || e.target.closest('[data-close]')) closeModal(); };
  document.body.style.overflow = 'hidden';
}
function closeModal() { const md = $('#modal'); md.classList.add('hidden'); md.classList.remove('flex'); md.innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden') && !$('#modal [data-lock]')) closeModal(); });

function loadPlan(decs) {
  S.slots = Array(S.ds.slots).fill(null);
  (decs || []).slice(0, S.ds.slots).forEach((d, i) => (S.slots[i] = { measure_id: d.measure_id, district_id: d.district_id || null }));
  onPlanChange();
}

let valTimer = null;
function onPlanChange() {
  renderMeasures();
  S.validating = true;
  renderRail();
  clearTimeout(valTimer);
  valTimer = setTimeout(runValidate, 120);
}
async function runValidate() {
  const seq = ++S.valSeq;
  try {
    const res = await api('POST', '/api/validate', { decisions: decisions() });
    if (seq !== S.valSeq) return;
    S.validation = res;
  } catch (e) {
    if (seq !== S.valSeq) return;
    S.validation = { valid: false, message: 'Сервер проверки недоступен: ' + e.message, errors: [] };
  }
  S.validating = false;
  renderRail();
}

/* =====================================================================
   ВЕРДИКТ
   ===================================================================== */
async function submitPlan() {
  const decs = decisions();
  S.verdict = null; S.verdictError = null; S.verdictLoading = true;
  S.narrative = null; S.narrativeError = null; S.narrativeLoading = true;
  S.crisis = null; S.crisisResolved = null;
  S.submitted = decs;
  go('verdict');
  loadNarrative(decs);
  try {
    S.verdict = await api('POST', '/api/evaluate', { decisions: decs });
  } catch (e) { S.verdictError = e.message; }
  S.verdictLoading = false;
  if (S.tab === 'verdict') renderVerdict();
}
async function loadNarrative(decs, verdict) {
  S.narrativeLoading = true; S.narrativeError = null;
  try { S.narrative = await api('POST', '/api/narrative', { decisions: decs, verdict }); }
  catch (e) { S.narrativeError = e.message; }
  S.narrativeLoading = false;
  if (S.tab === 'verdict') renderCouncil();
  if (S.tab === 'paper') renderPaper();
}

const charts = {};
function chart(id, cfg) { if (charts[id]) charts[id].destroy(); const c = document.getElementById(id); if (!c) return; charts[id] = new Chart(c, cfg); }

function emptyState(title, text, btn = 'В кабинет', to = 'cabinet') {
  return `<div class="card mx-auto max-w-xl p-8 text-center"><div class="text-lg font-semibold">${esc(title)}</div>
    <p class="mt-2 text-sm text-slate-400">${esc(text)}</p>
    <button data-go="${to}" class="mt-5 rounded-xl bg-accent px-4 py-2.5 text-sm font-bold text-base-950">${esc(btn)}</button></div>`;
}

function gaugeSVG(value, thr) {
  const v = Math.max(0, Math.min(100, Number(value) || 0));
  const R = 80, cx = 100, cy = 95;
  const pt = (p) => { const a = Math.PI * (1 - p / 100); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
  const [x1, y1] = pt(v);
  const [tx1, ty1] = pt(thr); const a = Math.PI * (1 - thr / 100);
  const tIn = [cx + (R - 16) * Math.cos(a), cy - (R - 16) * Math.sin(a)], tOut = [cx + (R + 12) * Math.cos(a), cy - (R + 12) * Math.sin(a)];
  const ok = v >= thr;
  return `<svg viewBox="0 -16 200 128" class="w-full max-w-[260px]">
    <path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    <path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${ok ? '#19b8d8' : '#ef4444'}" stroke-width="14" stroke-linecap="round"/>
    <line x1="${tIn[0]}" y1="${tIn[1]}" x2="${tOut[0]}" y2="${tOut[1]}" stroke="#e2e8f0" stroke-width="2"/>
    <text x="${tOut[0]}" y="${tOut[1] - 4}" text-anchor="middle" fill="#94a3b8" font-size="8.5">${thr}% · переизбрание</text>
    <text x="100" y="86" text-anchor="middle" fill="#fff" font-size="30" font-weight="800">${Math.round(v)}%</text>
    <text x="${cx - R}" y="110" text-anchor="middle" fill="#64748b" font-size="8">0</text>
    <text x="${cx + R}" y="110" text-anchor="middle" fill="#64748b" font-size="8">100</text>
  </svg>`;
}

  if (S.verdictError) {

        <span class="flex-1 text-slate-300">${esc(cr.comment || '')}</span></div>`
      : `<button id="crisisCta" class="fade-in mb-5 flex w-full items-center gap-4 rounded-2xl border border-red-500/40 bg-red-500/10 px-4 py-3 text-left hover:bg-red-500/15">
        <span class="pulse-ring grid h-9 w-9 shrink-0 place-items-center rounded-full bg-red-500 font-black text-white">!</span>
        <span class="flex-1"><span class="block text-[11px] font-bold uppercase tracking-widest text-red-300">II кв. 2028 · 5-й час</span>
        <span class="block text-sm font-semibold text-white">В городе кризис. Акиму придётся заменить одно решение.</span></span>
        <span class="shrink-0 rounded-lg bg-red-500 px-3 py-2 text-sm font-bold text-white">Открыть кризис</span></button>`}

    <div class="grid gap-4 lg:grid-cols-3">

        <div class="card-h">AQLS · индекс качества жизни</div>
        <div class="mt-3 flex items-end gap-3">
          <div class="text-7xl font-extrabold leading-none tracking-tight tabular-nums">${num(v.aqls)}</div>
        </div>
        <div class="mt-3 flex flex-wrap items-center gap-2 text-sm">
          <span class="rounded-full px-2.5 py-1 font-bold tabular-nums ${v.aqls >= base ? 'bg-emerald-400/15 text-emerald-300' : 'bg-red-500/15 text-red-300'}">${sign(v.aqls - base)}</span>
          <span class="text-slate-400">к ${num(base)} в начале срока</span>

      </div>

      <div class="card fade-in flex flex-col p-5">
        <div class="card-h">Счётчик сожаления</div>
        <div class="mt-4 text-sm leading-relaxed text-slate-300">максимум <b class="text-white">${num(max)}</b>, ваше место <b class="text-white">${int(v.rank)}</b> из ${int(total)}, топ <b class="text-accent">${num(v.top_percent, v.top_percent < 1 ? 2 : 1)}%</b></div>
        <div class="relative mt-6 h-3 rounded-full bg-base-800">

        <div class="mt-auto pt-4 text-sm text-slate-400">До оптимума не хватило <b class="tabular-nums text-white">${num(Math.max(0, max - v.aqls))}</b>. ${reelected ? '' : 'Но и оптимум не гарантирует переизбрания.'}</div>
      </div>
    </div>

    <div class="mt-4 grid gap-4 lg:grid-cols-3">

        <div class="mt-3 h-64"><canvas id="chPareto"></canvas></div>

      </div>
      <div class="card p-5">
        <div class="card-h">Вклад каждой меры</div>
        <div class="mt-1 text-[11px] text-slate-500">насколько упадёт AQLS, если убрать меру</div>
        <div class="mt-3 h-64"><canvas id="chContrib"></canvas></div>
      </div>
    </div>

    <div class="mt-4">${aiPanel(v)}</div>

    <div class="mt-4 card p-5">
      <div class="flex items-baseline justify-between"><div class="card-h">Совет районов</div><div class="text-[11px] text-slate-500">депутаты маслихата о вашем плане</div></div>
      <div id="council" class="mt-4"></div>
    </div>

    <div class="mt-6 flex flex-wrap gap-2">
      <button data-go="paper" class="rounded-xl bg-accent px-4 py-2.5 text-sm font-bold text-base-950">Открыть «Астана Times»</button>
      <button data-go="cabinet" class="rounded-xl border border-base-600 px-4 py-2.5 text-sm">Изменить план</button>
      <button data-go="board" class="rounded-xl border border-base-600 px-4 py-2.5 text-sm">В лидерборд</button>
    </div>`;

  const cta = $('#crisisCta'); if (cta) cta.onclick = openCrisis;
  const ab = $('#applyRec'); if (ab) ab.onclick = applyRecommendation;
  renderCouncil();
  drawVerdictCharts(v, base);
}

function districtTable(v) {
  const dirs = S.ds.directions;
  const cell = (x, b) => {
    const red = x != null && x < 40;
    const d = b != null && x != null ? x - b : null;
    return `<td class="px-2 py-2 text-center tabular-nums ${red ? 'bg-red-500/15 text-red-300 font-semibold' : ''}">${num(x, 1)}${d != null && Math.abs(d) >= 0.05 ? `<div class="text-[10px] ${d > 0 ? 'text-emerald-400' : 'text-red-400'}">${sign(d, 1)}</div>` : ''}</td>`;
  };
  return `<table class="w-full min-w-[620px] text-sm">
    <thead><tr class="border-b border-base-700 text-[11px] uppercase tracking-wider text-slate-500">
      <th class="py-2 pr-2 text-left font-semibold">Район</th>
      ${dirs.map((d) => `<th class="px-2 py-2 font-semibold">${esc(shortDir(d.id))}</th>`).join('')}
      <th class="px-2 py-2 font-semibold">AQLS до → после</th><th class="py-2 pl-2 text-right font-semibold">Δ</th></tr></thead>
    <tbody>${(v.districts || []).map((r) => `<tr class="border-b border-base-800 last:border-0">
      <td class="py-2 pr-2 font-medium">${esc(r.name)}</td>
      ${dirs.map((d) => cell(r.indices_after?.[d.id], r.indices_before?.[d.id])).join('')}
      <td class="px-2 py-2 text-center tabular-nums"><span class="${r.before < 40 ? 'text-red-400' : 'text-slate-400'}">${num(r.before)}</span> → <b class="${r.after < 40 ? 'text-red-400' : ''}">${num(r.after)}</b></td>
      <td class="py-2 pl-2 text-right font-bold tabular-nums ${r.delta > 0.005 ? 'text-emerald-400' : r.delta < -0.005 ? 'text-red-400' : 'text-slate-400'}">${sign(r.delta)}</td></tr>`).join('')}
    </tbody></table>
    <div class="mt-2 text-[11px] text-slate-500">Красным — показатели ниже 40.</div>`;
}

function aiPanel(v) {

function crisisPlan() { return (S.verdict?.decisions || S.submitted || []).map((d) => ({ measure_id: d.measure_id, district_id: d.district_id || null })); }

async function crisisValidate() {

      <div class="mt-6 grid gap-6 border-t border-stone-800 pt-5 md:grid-cols-12">
        <div class="md:col-span-8">
          <div class="kicker red">Главное</div>
          <h3 class="hl mt-1 text-2xl">${esc(lead.title || 'Итоги двух лет')}</h3>
          <div class="cols-2 mt-3 text-[15.5px] leading-relaxed">
            ${body.map((p, i) => `<p class="${i === 0 ? 'dropcap' : ''} mb-3">${esc(p)}</p>`).join('')}
            ${(n.articles || []).map((a) => `<h4 class="hl mt-2 text-lg" style="break-after:avoid">${esc(a.title)}</h4><p class="mb-3">${esc(a.body)}</p>`).join('')}
          </div>
          ${n.editorial ? `<div class="mt-5 border-t-2 border-stone-900 pt-4">
            <div class="kicker text-stone-600">Мнение</div>
            <h3 class="hl mt-1 text-xl italic">${esc(n.editorial.title || 'Колонка редактора')}</h3>
            <p class="mt-2 text-[15.5px] italic leading-relaxed">${esc(n.editorial.body || n.editorial)}</p></div>` : ''}
        </div>
        <aside class="space-y-5 md:col-span-4 md:border-l md:border-stone-800 md:pl-6">
          <div class="redbox">
            <div class="redbar px-3 py-1.5 kicker">Критические зоны</div>
            <div class="divide-y divide-red-900/20 px-3">
              ${zones.length ? zones.map((z) => `<div class="py-2.5"><div class="flex items-baseline justify-between"><b class="font-serif text-[16px]">${esc(z.district || z.name)}</b>
                <span class="red font-display text-xl font-black">${num(z.aqls)}</span></div><div class="text-[13px] text-stone-700">${esc(z.note || '')}</div></div>`).join('')
                : '<div class="py-3 text-[14px] italic text-stone-700">Ни один район не опустился ниже 40. Редакция проверила дважды.</div>'}
            </div>
          </div>
          <div class="border-y-2 border-stone-900 py-3">
            <div class="kicker mb-2 text-stone-600">Цифры квартала</div>
            <div class="grid grid-cols-3 gap-2 text-center">${stats.map((s) => `<div><div class="font-display text-2xl font-black leading-none">${esc(s.value)}</div><div class="mt-1 text-[11px] text-stone-600">${esc(s.label)}</div></div>`).join('')}</div>
          </div>
          ${quotes.length ? `<div><div class="kicker mb-2 text-stone-600">Говорят депутаты</div>${quotes.map((q) => `
            <blockquote class="mb-3 border-l-2 border-stone-800 pl-3"><p class="text-[14px] italic leading-snug" style="text-align:left">${esc(q.reaction)}</p>
            <div class="mt-1 text-[12px] text-stone-600">— ${esc(q.deputy)}, ${esc(q.district)}</div></blockquote>`).join('')}</div>` : ''}
        </aside>
      </div>
      <div class="rule mt-6"></div>
      <div class="flex justify-between pt-1.5 text-[11px] text-stone-600"><span>Данные — модель AQLS по решениям читателя</span><span>${S.narrative.mode && S.narrative.mode !== 'llm' ? 'Текст: офлайн-шаблон' : 'Текст: ИИ-редакция'}</span></div>
    </article>
    <div class="mx-auto mt-6 flex max-w-5xl flex-wrap justify-center gap-2">
      <button data-go="verdict" class="rounded-xl border border-base-600 px-4 py-2.5 text-sm">← К вердикту</button>
      <button data-go="board" class="rounded-xl bg-accent px-4 py-2.5 text-sm font-bold text-base-950">В лидерборд</button></div>`;
}

/* =====================================================================
   ЛИДЕРБОРД
   ===================================================================== */
const B = { timer: null, rows: null, error: null, updated: 0, loading: false, mine: null };
function startBoard() { renderBoard(); refreshBoard(); clearInterval(B.timer); B.timer = setInterval(refreshBoard, 5000); }
function stopBoard() { clearInterval(B.timer); B.timer = null; }
async function refreshBoard() {
  B.loading = true; renderBoardTable();
  try {
    const r = await api('GET', '/api/leaderboard' + (CONFIG.SESSION ? '?session=' + encodeURIComponent(CONFIG.SESSION) : ''));
    B.rows = (Array.isArray(r) ? r : r.entries || r.rows || []).slice().sort((a, b) => (b.aqls ?? 0) - (a.aqls ?? 0));
    B.error = null; B.updated = Date.now();
  } catch (e) { B.error = e.message; }
  B.loading = false; renderBoardTable();
}
function renderBoard() {
  const has = !!S.verdict;
  $('#tab-board').innerHTML = `
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div><div class="card-h mb-1">Лидерборд${CONFIG.SESSION ? ' · комната ' + esc(CONFIG.SESSION) : ''}</div>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Кто лучше управляет Астаной</h1>
        <p class="mt-1.5 text-sm text-slate-400">Сортировка по AQLS. Но смотрите на рейтинг: лучший индекс не всегда переизбирают.</p></div>
    </div>
    <div class="grid gap-4 lg:grid-cols-[340px_1fr]">
      <form id="lbForm" class="card h-fit p-5">
        <div class="card-h mb-3">Отправить результат</div>
        ${has ? `<div class="mb-3 rounded-xl bg-base-850 p-3 text-sm">Ваш AQLS <b class="tabular-nums">${num(S.verdict.aqls)}</b> · рейтинг <b class="tabular-nums">${Math.round(S.verdict.approval)}%</b></div>`
          : '<div class="mb-3 rounded-xl border border-dashed border-base-600 p-3 text-sm text-slate-400">Сначала получите вердикт в кабинете.</div>'}
        <label class="text-[12px] text-slate-400" for="team">Название команды</label>
        <input id="team" maxlength="40" required autocomplete="off" placeholder="Например, «Сарыарка вперёд»" class="mt-1 w-full rounded-xl border border-base-600 bg-base-900 px-3 py-2.5 text-sm outline-none focus:border-accent" ${has ? '' : 'disabled'}>
        <button class="mt-3 w-full rounded-xl px-4 py-2.5 text-sm font-bold ${has ? 'bg-accent text-base-950' : 'cursor-not-allowed bg-base-800 text-slate-500'}" ${has ? '' : 'disabled'}>Отправить</button>
        <div id="lbMsg" class="mt-2 min-h-[18px] text-[12px] text-slate-400"></div>
      </form>
      <div class="card overflow-hidden">
        <div class="flex items-center justify-between border-b border-base-700 px-5 py-3"><div class="card-h">Таблица</div><div id="lbStatus" class="text-[11px] text-slate-500"></div></div>
        <div id="lbTable" class="overflow-x-auto"></div>
      </div>
    </div>`;
  $('#lbForm').onsubmit = async (e) => {
    e.preventDefault();
    const team = $('#team').value.trim(); if (!team || !S.verdict) return;
    $('#lbMsg').innerHTML = spinner('Отправляем…');
    try {
      await api('POST', '/api/leaderboard', { team, session: CONFIG.SESSION, decisions: S.verdict.decisions || S.submitted, aqls: S.verdict.aqls, approval: S.verdict.approval });
      B.mine = team; $('#lbMsg').textContent = 'Готово — вы в таблице.'; $('#team').value = '';
      refreshBoard();
    } catch (err) { $('#lbMsg').textContent = 'Не удалось отправить: ' + err.message; }
  };
  renderBoardTable();
}
function renderBoardTable() {
  const t = $('#lbTable'), st = $('#lbStatus'); if (!t) return;
  st.innerHTML = B.loading ? '<span class="spin"></span>' : B.error ? `<span class="text-red-400">нет связи</span>` : B.updated ? `обновлено ${new Date(B.updated).toLocaleTimeString('ru-RU')} · каждые 5 с` : '';
  if (!B.rows) { t.innerHTML = B.error ? `<div class="p-5 text-sm text-slate-400">Лидерборд недоступен: ${esc(B.error)}</div>` : `<div class="space-y-2 p-5">${Array(4).fill(skel('h-10')).join('')}</div>`; return; }
  if (!B.rows.length) { t.innerHTML = '<div class="p-6 text-center text-sm text-slate-400">Пока пусто. Будьте первыми.</div>'; return; }
  const thr = S.ds?.reelection_threshold ?? 50;
  t.innerHTML = `<table class="w-full min-w-[520px] text-sm"><thead><tr class="text-[11px] uppercase tracking-wider text-slate-500">
    <th class="px-5 py-2.5 text-left font-semibold">#</th><th class="py-2.5 text-left font-semibold">Команда</th><th class="px-3 py-2.5 text-right font-semibold">AQLS</th>
    <th class="px-3 py-2.5 text-right font-semibold">Рейтинг</th><th class="px-3 py-2.5 text-left font-semibold">Итог</th><th class="px-5 py-2.5 text-right font-semibold">Бюджет</th></tr></thead>
    <tbody>${B.rows.map((r, i) => { const re = r.reelected ?? (r.approval >= thr); const mine = B.mine && r.team === B.mine; return `
      <tr class="border-t border-base-800 ${mine ? 'bg-accent/10' : ''}">
        <td class="px-5 py-3 font-bold tabular-nums ${i === 0 ? 'text-accent' : 'text-slate-400'}">${i + 1}</td>
        <td class="py-3 font-medium">${esc(r.team)}</td>
        <td class="px-3 py-3 text-right font-bold tabular-nums">${num(r.aqls)}</td>
        <td class="px-3 py-3 text-right tabular-nums ${re ? '' : 'text-red-400'}">${r.approval != null ? Math.round(r.approval) + '%' : '—'}</td>
        <td class="px-3 py-3"><span class="rounded-full px-2 py-0.5 text-[11px] font-bold ${re ? 'bg-accent/15 text-accent' : 'bg-red-500/15 text-red-300'}">${re ? 'Переизбран' : 'Уволен'}</span></td>
        <td class="px-5 py-3 text-right tabular-nums text-slate-400">${r.budget_used ?? '—'}</td></tr>`; }).join('')}</tbody></table>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  renderTabs();
  renderCabinetShell();
  let raw = null;
  if (!CONFIG.MOCK) {
    try { raw = await api('GET', '/api/dataset'); SOURCE = 'api'; }
    catch (e) {
      console.warn('API недоступен, переходим на демо-данные', e);
      const b = $('#banner'); b.textContent = 'Сервер недоступен — работаем на демо-данных. Все экраны доступны.'; b.classList.remove('hidden');
    }
  }
  if (!raw) { SOURCE = 'mock'; try { raw = await mockCall('GET', '/api/dataset'); } catch (e) {
    $('#measures').innerHTML = `<div class="card p-6 text-sm text-red-300">Не удалось загрузить данные: ${esc(e.message)}. Откройте страницу через веб-сервер (не file://).</div>`; return; } }
  S.ds = normalizeDataset(raw);
  S.slots = Array(S.ds.slots).fill(null);
  const mb = $('#modeBadge'); mb.textContent = SOURCE === 'api' ? 'API · живые данные' : 'демо-данные'; mb.classList.remove('hidden');
  onPlanChange();
  const h = location.hash.replace('#', '');
  if (h === 'board') go('board', false); else go('cabinet', false);
}
boot();
</script>
</body>
</html>
