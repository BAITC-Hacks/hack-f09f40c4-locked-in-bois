<script>
'use strict';
/* =====================================================================
   CONFIG — the ONE place to point the page at a backend.
   ?mock=1        → replay web/mock/*.json fixtures (real API responses for the doc example)
   ?api=https://… → API base URL (default: same origin; FastAPI serves this page at /)
   ?session=room1 → leaderboard room
   ?seed=1        → fixed crisis event (events[seed % 3]); random otherwise
   ===================================================================== */
const QS = new URLSearchParams(location.search);
const CONFIG = {
  API_BASE: (QS.get('api') || '').replace(/\/$/, ''),
  MOCK: QS.get('mock') === '1',
  SESSION: (QS.get('session') || '').trim().replace(/[\[\]]/g, '').slice(0, 12),
  SEED: QS.has('seed') && !isNaN(parseInt(QS.get('seed'), 10)) ? parseInt(QS.get('seed'), 10) : null,
  TIMEOUT_MS: 15000,
  LLM_TIMEOUT_MS: 120000,
};

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

/* ---------------- API layer ---------------- */
let SOURCE = null; // 'api' | 'mock'
class HttpError extends Error { constructor(status, msg) { super(msg); this.status = status; } }
async function api(method, path, body, { timeout = CONFIG.TIMEOUT_MS } = {}) {
  if (SOURCE === 'mock') return mockCall(method, path, body);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(CONFIG.API_BASE + path, {
      method, signal: ctl.signal,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) {
      let detail = '';
      try { const j = await r.json(); detail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {}
      throw new HttpError(r.status, detail || `Ошибка сервера ${r.status}`);
    }
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер не ответил вовремя');
    if (e instanceof HttpError) throw e;
    throw new Error('Нет связи с сервером');
  } finally { clearTimeout(timer); }
}

/* mock: replays real API fixtures captured by web/tools/capture_fixtures.py (doc example plan) */
const FIX = {};
const fx = (name) => (FIX[name] ||= fetch('mock/' + name + '.json').then((r) => { if (!r.ok) throw new Error('mock ' + name); return r.json(); }));
const LB_KEY = 'akim.leaderboard.v2';
const lbLoad = () => { try { const x = JSON.parse(localStorage.getItem(LB_KEY)); if (Array.isArray(x)) return x; } catch (e) {} return []; };
const lbSave = (x) => { try { localStorage.setItem(LB_KEY, JSON.stringify(x)); } catch (e) {} };
async function mockCall(method, path, body) {
  await sleep(150 + Math.random() * 250);
  const plan = body && (body.plan || body);
  const p = path.split('?')[0];
  if (p === '/api/dataset') return fx('dataset');
  if (p === '/api/health') return { ok: true, provider: 'mock' };
  if (p === '/api/validate') return localValidate(plan);
  const need = (pl) => { const v = localValidate(pl); if (!v.valid) throw new HttpError(422, v.reason); };
  if (p === '/api/score') {
    need(plan);
    const normalize = (pl) => planDecs(pl).map((d) => ({ measure: d.measure, district: d.district ?? null }))
      .sort((a, b) => a.measure.localeCompare(b.measure));
    const fixturePlan = (await fx('dataset')).reference.doc_example;
    if (JSON.stringify(normalize(plan)) !== JSON.stringify(normalize(fixturePlan))) {
      throw new HttpError(422, 'В деморежиме считается только пример из ТЗ — запустите сервер');
    }
    return fx('score');
  }
  if (p === '/api/optimize') return fx('optimize');
  if (p === '/api/analyze') return fx('analyze');
  if (p === '/api/narrative') return fx(body.event_id ? 'narrative_crisis' : 'narrative');
  if (p === '/api/shock') return fx('shock');
  if (p === '/api/shock/resolve') { need(applySwap(plan, body.swap)); return fx('resolve'); }
  if (p === '/api/submit') {
    const s = await fx('score'); const all = lbLoad();
    all.push({ team: body.team, score: s.score, cost: s.cost, approval: s.approval.city, plan, created_at: new Date().toISOString() });
    lbSave(all); return { ok: true, id: all.length, rank: all.filter((r) => r.score > s.score).length + 1 };
  }
  if (p === '/api/leaderboard') return lbLoad().sort((a, b) => b.score - a.score);
  throw new Error('mock: нет ответа для ' + p);
}

const S = {

  slots: [], val: null, validating: false, valSeq: 0,
  plan: null, run: 0, narBody: null,
  r: { score: null, opt: null, ai: null, nar: null },   // each: {loading}|{data}|{error}

};
const IND_SHORT = { T1: 'дороги', T2: 'общ. транспорт', E1: 'зелень', E2: 'воздух', S1: 'школы', S2: 'поликлиники', B1: 'улицы', B2: 'безопасность движения', C1: 'ЖКХ', C2: 'обращения' };
const QL = ['старт', 'I кв. 27', 'II кв. 27', 'III кв. 27', 'IV кв. 27', 'I кв. 28', 'II кв. 28', 'III кв. 28', 'IV кв. 28'];
const indShort = (c) => IND_SHORT[c] || S.ind[c]?.name || c;
const dirName = (id) => S.dir[id]?.name || id;
const loc = (name) => S.dist[name]?.cases?.loc || name;
const realized = (m) => Math.max(0, S.ds.horizon_quarters - m.lag) / S.ds.horizon_quarters;
const districtD = (d) => S.ds.indicators.reduce((s, i) => s + i.weight * d.values[i.code], 0);
const planOf = () => ({ decisions: S.slots.filter(Boolean).map((s) => ({ measure: s.measure, district: s.district ?? null })) });
const planDecs = (p) => (Array.isArray(p) ? p : p?.decisions) || [];
const decShort = (d) => `${d.measure}${d.district ? ' · ' + d.district : ''}`;
const decLong = (d) => { const m = S.mi[d.measure]; return m ? `${m.id} «${m.name}»${d.district ? ' · ' + d.district : ''}` : d.measure; };
const BASELINE = () => S.ds?.reference?.baseline_score ?? 52.56;
function applySwap(plan, swap) {
  const decs = planDecs(plan).map((d) => ({ ...d }));
  const i = decs.findIndex((d) => d.measure === swap?.out);
  if (i >= 0 && swap?.in) decs[i] = { measure: swap.in.measure, district: swap.in.district ?? null };
  return { decisions: decs };
}
function indexDataset(ds) {
  ds.budget ??= 100; ds.horizon_quarters ??= 8; ds.decisions_required ??= 5; ds.max_per_direction ??= 2; ds.crit_threshold ??= 40;
  S.ds = ds;
  S.mi = Object.fromEntries(ds.measures.map((m) => [m.id, m]));
  S.dir = Object.fromEntries(ds.directions.map((d) => [d.id, d]));
  S.ind = Object.fromEntries(ds.indicators.map((i) => [i.code, i]));
  S.dist = Object.fromEntries(ds.districts.map((d) => [d.name, d]));
}

/* local validator: same rules and order as engine/validate.py (instant hints + mock mode).
   {partial:true} skips "exactly 5" so conflicts show while the plan is still being built. */
function localValidate(plan, { partial = false } = {}) {
  const ds = S.ds, decs = planDecs(plan), ms = S.mi;
  let cost = 0; const counts = Object.fromEntries(ds.directions.map((d) => [d.id, 0]));
  for (const d of decs) { const m = ms[d.measure]; if (m) { cost += m.cost; counts[m.direction] = (counts[m.direction] || 0) + 1; } }
  const res = (reason) => ({ valid: !reason, reason: reason || null, cost, remaining: ds.budget - cost, direction_counts: counts });
  if (!partial && decs.length !== ds.decisions_required) return res(`Нужно ровно ${ds.decisions_required} решений, выбрано ${decs.length}`);
  const ids = decs.map((d) => d.measure);
  if (new Set(ids).size !== ids.length) return res('Повторы запрещены: каждая мера — не больше одного раза');
  for (const d of decs) if (!ms[d.measure]) return res(`Неизвестная мера ${d.measure}`);
  if (cost > ds.budget) return res(`Бюджет превышен: ${cost} из ${ds.budget}`);
  for (const d of decs) {
    const m = ms[d.measure];
    if (m.type === 'district' && !d.district) return res(`${m.id}: для районной меры нужен район`);
    if (m.type === 'city' && d.district) return res(`${m.id}: городская мера, район не указывается`);
  }
  for (const [k, n] of Object.entries(counts)) if (n > ds.max_per_direction) return res(`Не более ${ds.max_per_direction} мер из направления «${dirName(k)}»`);
  for (const inc of ds.incompatibilities || []) {
    const [a, b] = inc.pair; const A = decs.filter((d) => d.measure === a), B = decs.filter((d) => d.measure === b);
    if (A.length && B.length && (inc.scope === 'anywhere' || A.some((x) => B.some((y) => x.district === y.district)))) return res(inc.reason);
  }
  return res(null);
}
function blockReason(m, district, decs) {
  if (decs.some((d) => d.measure === m.id)) return 'Уже в плане';
  if (decs.length >= S.ds.decisions_required) return 'План заполнен — уберите одну из мер';
  const n = decs.filter((d) => S.mi[d.measure]?.direction === m.direction).length;
  if (n >= S.ds.max_per_direction) return `В направлении уже ${S.ds.max_per_direction} меры`;
  for (const inc of S.ds.incompatibilities || []) {
    if (!inc.pair.includes(m.id)) continue;
    const other = inc.pair[0] === m.id ? inc.pair[1] : inc.pair[0];
    const hits = decs.filter((d) => d.measure === other);
    if (!hits.length) continue;
    if (inc.scope === 'anywhere') return inc.reason;
    if (district && hits.some((h) => h.district === district)) return inc.reason;
  }
  return null;
}

function budgetSvg(used, budget, over) {
  const h = 150, fill = Math.min(1, used / budget) * h;
  return `<svg viewBox="0 0 60 ${h + 20}" width="60" height="${h + 20}" aria-hidden="true">
    <rect x="24.5" y="10.5" width="22" height="${h}" fill="#fbfdfd"/>
    <rect x="24.5" y="${10.5 + h - fill}" width="22" height="${fill}" fill="${over ? '#cf3a2c' : '#19b8d8'}"/>
    <rect x="24.5" y="10.5" width="22" height="${h}" fill="none" stroke="#0d2a33"/>
    ${[0, .25, .5, .75, 1].map((f) => { const y = 10.5 + h - f * h; return `<line x1="17" x2="24.5" y1="${y}" y2="${y}" stroke="#0d2a33"/><text x="14" y="${y + 3}" text-anchor="end" font-size="8.5" font-family="JetBrains Mono" fill="#56696f">${Math.round(f * budget)}</text>`; }).join('')}</svg>`;
}

/* LLM/template prose arrives as "56.54" / "694 395": print it like the rest of the UI (decimal comma, no-break thousands). Numbers stay numbers. */
const ruProse = (x, k) => (typeof x === 'string' ? (k === 'provider' ? x : x.replace(/(\d)\.(\d)/g, '$1,$2').replace(/(\d) (\d{3})(?!\d)/g, '$1\u00a0$2'))
  : Array.isArray(x) ? x.map((v) => ruProse(v)) : x && typeof x === 'object' ? Object.fromEntries(Object.entries(x).map(([kk, v]) => [kk, ruProse(v, kk)])) : x);

    .catch((e) => { if (run === S.run) S.r[key] = { error: e.message }; })
    .finally(() => { if (run === S.run) refresh(key); });
}

function dial(value, min, max, opts = {}) {
  const W = 260, H = 150, cx = 130, cy = 132, R = 110;
  const ang = (v) => Math.PI * (1 - (Math.max(min, Math.min(max, v)) - min) / (max - min));
  const pt = (v, r) => [cx + r * Math.cos(ang(v)), cy - r * Math.sin(ang(v))];
  let ticks = '';
  const step = opts.step || (max - min) / 10;
  for (let v = min; v <= max + 1e-9; v += step / 2) {
    const major = Math.abs(((v - min) / step) % 1) < 1e-6;
    const [x1, y1] = pt(v, R), [x2, y2] = pt(v, R - (major ? 14 : 7));
    ticks += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#0d2a33" stroke-width="${major ? 1.6 : .8}"/>`;
    if (major) { const [tx, ty] = pt(v, R - 27); ticks += `<text x="${tx.toFixed(1)}" y="${(ty + 4).toFixed(1)}" font-size="10" text-anchor="middle" fill="#56696f" font-family="JetBrains Mono" stroke="#dfe5e6" stroke-width="4" stroke-linejoin="round" paint-order="stroke">${num(v, 0)}</text>`; }
  }
  let zone = '';
  if (opts.redBelow != null) { const [a1, b1] = pt(min, R + 6), [a2, b2] = pt(opts.redBelow, R + 6); zone = `<path d="M${a1},${b1} A${R + 6},${R + 6} 0 0 1 ${a2},${b2}" fill="none" stroke="#cf3a2c" stroke-width="5"/>`; }
  if (opts.from != null && Math.abs(value - opts.from) > 1e-6) { const [a1, b1] = pt(Math.min(opts.from, value), R + 6), [a2, b2] = pt(Math.max(opts.from, value), R + 6); zone += `<path d="M${a1.toFixed(1)},${b1.toFixed(1)} A${R + 6},${R + 6} 0 0 1 ${a2.toFixed(1)},${b2.toFixed(1)}" fill="none" stroke="${value >= opts.from ? '#19b8d8' : '#cf3a2c'}" stroke-width="5"/>`; }
  const marks = (opts.marks || []).map((m) => { const a = ang(m.v), [tx, ty] = pt(m.v, R + 1), [bx, by] = pt(m.v, R + 14), px = 5.5 * Math.sin(a), py = 5.5 * Math.cos(a);
    return `<path d="M${tx.toFixed(1)},${ty.toFixed(1)} L${(bx + px).toFixed(1)},${(by + py).toFixed(1)} L${(bx - px).toFixed(1)},${(by - py).toFixed(1)} Z" fill="${m.c}"/>`; }).join('');
  const na = ang(value), ux = Math.cos(na), uy = -Math.sin(na), nc = opts.needle || '#19b8d8';
  const np = (l, w) => `${(cx + ux * l + uy * w).toFixed(1)},${(cy + uy * l - ux * w).toFixed(1)}`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label || '')}">${zone}${marks}
    <path d="M${np(R - 6, 0)} L${np(0, 4)} L${np(-13, 0)} L${np(0, -4)} Z" fill="${nc}"/>${ticks}
    <circle cx="${cx}" cy="${cy}" r="8" fill="#0d2a33"/><circle cx="${cx}" cy="${cy}" r="2.5" fill="${nc}"/></svg>`;
}

/* ---- charts (Chart.js on millimetre paper) ---- */
const refLines = {
  id: 'refLines',
  afterDatasetsDraw(c) {
    const { ctx } = c;
    c.data.datasets.forEach((ds, i) => {
      if (!ds.refLabel || !c.isDatasetVisible(i)) return;
      const meta = c.getDatasetMeta(i), pt = meta.data[meta.data.length - 1]; if (!pt) return;
      ctx.save(); ctx.font = '600 11.5px "JetBrains Mono"'; ctx.textAlign = 'right'; ctx.lineJoin = 'round';
      ctx.lineWidth = 4; ctx.strokeStyle = '#f0f5f5'; ctx.strokeText(ds.refLabel, c.chartArea.right, pt.y - 7);
      ctx.fillStyle = ds.refColor || ds.borderColor; ctx.fillText(ds.refLabel, c.chartArea.right, pt.y - 7); ctx.restore();
    });
  },
};
function chartBase() {
  Chart.defaults.font.family = '"JetBrains Mono", ui-monospace, monospace';
  Chart.defaults.font.size = 11.5;
  Object.assign(Chart.defaults.plugins.tooltip, { backgroundColor: '#0d2a33', titleColor: '#8fc9d6', bodyColor: '#e9f6f8', cornerRadius: 0, caretSize: 5, padding: 10, displayColors: false });
  Chart.defaults.color = '#56696f';
}
function drawTrace() {
  if (!$('#chTrace') || !S.r.score?.data) return;
  chartBase();
  const v = S.r.score.data, o = S.r.opt?.data, base = v.baseline ?? BASELINE();
  const tl = v.timeline || [];
  const vals = tl.map((t) => t.score);
  const flat = (y, color, label, dash) => ({ data: tl.map(() => y), borderColor: color, borderWidth: 1.5, borderDash: dash, pointRadius: 0, refLabel: label, fill: false });
  const tip = (a, b) => vals.map((_, i) => (i === vals.length - 1 ? a : b));
  const ds = [{ data: vals, borderColor: '#19b8d8', borderWidth: 4, pointRadius: tip(6, 3.5), pointBackgroundColor: tip('#fff', '#0d2a33'), pointBorderColor: '#19b8d8', pointBorderWidth: tip(4, 0), pointHoverRadius: tip(7, 5.5), pointHoverBackgroundColor: tip('#fff', '#0d2a33'), pointHoverBorderWidth: tip(4, 2), cubicInterpolationMode: 'monotone', fill: false }];
  ds.push(flat(base, '#56696f', `${S.crisis ? 'база с кризисом' : 'без решений'} ${num(base)}`, [6, 5]));
  const pre = S.crisis?.before?.timeline;
  if (pre && pre.length === tl.length) ds.push({ data: pre.map((t) => t.score), borderColor: '#8fc9d6', borderWidth: 2, borderDash: [2, 4], pointRadius: 0, cubicInterpolationMode: 'monotone', refLabel: `план до кризиса ${num(S.crisis.before.score)}`, refColor: '#0a7d95', fill: false });
  if (o) ds.push(flat(o.best.score, '#cf3a2c', `${S.crisis ? 'оптимум до кризиса' : 'оптимум'} ${num(o.best.score)} · рейтинг ${num(o.best.approval, 1)}%`, [6, 5]));
  const lo = Math.min(...vals, base) - .4, hi = Math.max(...vals, o?.best?.score ?? 0) + .4;
  chart('chTrace', {
    type: 'line', data: { labels: tl.map((t) => QL[t.q] ?? 'Q' + t.q), datasets: ds }, plugins: [refLines],
    options: { maintainAspectRatio: false, animation: charts.chTrace?.canvas === $('#chTrace') || matchMedia('(prefers-reduced-motion: reduce)').matches ? false : { duration: 900, easing: 'easeOutQuart' }, layout: { padding: { top: 16 } },
      plugins: { legend: { display: false }, tooltip: { backgroundColor: '#0d2a33', titleFont: { family: 'JetBrains Mono' }, bodyFont: { family: 'JetBrains Mono' }, filter: (i) => i.datasetIndex === 0, callbacks: { label: (c) => `Score ${num(c.parsed.y)}`, afterLabel: (c) => `${sign(c.parsed.y - base)} к базе ${num(base)}` } } },
      scales: { x: { grid: { drawOnChartArea: false, color: '#0d2a33', tickLength: 5 }, border: { color: '#0d2a33' }, ticks: { maxRotation: 0, autoSkip: false, callback(v, i) { const n = this.chart.data.labels.length; return this.chart.width < 560 && (n - 1 - i) % 2 ? '' : this.getLabelForValue(v); } } }, y: { min: Math.floor(lo * 2) / 2, max: Math.ceil(hi * 2) / 2, grid: { drawOnChartArea: false, color: '#0d2a33', tickLength: 5 }, border: { color: '#0d2a33' }, ticks: { stepSize: .5, callback: (x) => num(x, 1) } } } },
  });
}
function drawPareto() {

          ${sc ? `<div><div class="mid">${num(sc.score)}</div><div class="text-[12px] text-graph">Score</div></div>` : ''}
          ${sc?.approval ? `<div><div class="mid ${sc.approval.reelected ? '' : 'red'}">${num(sc.approval.city, 1)}%</div><div class="text-[12px] text-graph leading-tight">рейтинг акима<br>слой политического риска, не входит в Score</div></div>` : ''}
          ${sc ? `<div><div class="mid">${sc.cost}<span class="text-graph" style="font-size:.6em">/${S.ds.budget}</span></div><div class="text-[12px] text-graph">единиц бюджета</div></div>` : ''}
          ${opt ? `<div><div class="mid">${int(opt.rank)}</div><div class="text-[12px] text-graph">${S.crisis ? 'место до кризиса' : 'место'} из ${int(opt.total_valid)}</div></div>` : ''}</div></div>
      </div>
      ${sc ? `<div class="mt-8"><div class="lbl shd">Индекс районов: до и после срока</div><table class="log"><tbody>${Object.entries(sc.districts).map(([name, d]) => `<tr><td style="text-align:left;font:600 15px 'Sofia Sans',sans-serif">${esc(name)}${name === sc.d_min_district ? ' <span class="hidden text-[12px] font-normal text-graph sm:inline">· слабейший</span>' : ''}</td><td class="whitespace-nowrap">${num(d.D_before)} → ${num(d.D_after)}</td><td class="whitespace-nowrap" style="width:1%"><b class="${d.D_after - d.D_before > .005 ? 'peni' : ''}">${sign(d.D_after - d.D_before)}</b></td></tr>`).join('')}</tbody></table></div>` : ''}
      <div class="mt-6 border-y ${crit.length ? 'border-alarm' : 'border-rule'} py-3"><div class="lbl mb-1 ${crit.length ? 'red' : ''}">Критические зоны</div>
        ${crit.length ? crit.map((z) => `<div class="body">${esc(z.district)} · ${esc(indShort(z.indicator))} — <b class="mono red">${num(z.value, 1)}</b></div>`).join('') : `<div class="body">Показателей ниже порога ${S.ds.crit_threshold} нет.${sc ? ` Слабейший район — ${esc(sc.d_min_district)}: ${num(sc.d_min)}.` : ''}</div>`}</div>
      ${pick.length ? `<div class="mt-8"><div class="lbl shd">Голоса горсовета</div><div class="grid gap-x-12 gap-y-5 pt-4 sm:grid-cols-2">${pick.map((q) => `<blockquote class="m-0"><p class="m-0 text-[16.5px] italic leading-[1.45]">«${esc(unq(q.quote)).replace(/«/g, '„').replace(/»/g, '“')}»</p><div class="mt-2 text-[12.5px] font-semibold text-graph">— ${esc(q.deputy)}</div></blockquote>`).join('')}</div></div>` : ''}
      <div class="mt-8 flex flex-wrap justify-between gap-x-6 gap-y-1 border-t border-dashed border-rule pt-2.5 text-[12px] text-graph"><span>цифры — движок AQLS · ИИ пишет текст, но не считает</span><span>${provider === 'offline' ? 'текст: офлайн-шаблон' : 'текст: ИИ-редакция (' + esc(provider) + ')'}</span></div>
    </article>
    <div class="mx-auto mt-6 flex max-w-[900px] flex-wrap justify-center gap-2"><button data-go="verdict" class="btn btn-line">← К вердикту</button><button data-go="board" class="btn btn-ink">В лидерборд</button></div>`;
}

/* =====================================================================
   ЛИДЕРБОРД
   ===================================================================== */
const B = { timer: null, rows: null, error: null, updated: 0, loading: false, mine: null, reveal: false, opt: null };
const TAG = CONFIG.SESSION ? ` [${CONFIG.SESSION}]` : '';
function startBoard() { renderBoard(); refreshBoard(); clearInterval(B.timer); B.timer = setInterval(refreshBoard, 5000); }
function stopBoard() { clearInterval(B.timer); B.timer = null; }
async function refreshBoard() {
  B.loading = true; renderBoardTable();
  try {
    const r = await api('GET', '/api/leaderboard');
    let rows = Array.isArray(r) ? r : r.entries || [];
    rows = rows.filter((x) => (CONFIG.SESSION ? String(x.team).endsWith(TAG) : !/\s\[[^\]]+\]$/.test(String(x.team))));
    B.rows = rows.sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
    B.error = null; B.updated = Date.now();
  } catch (e) { B.error = e.message; }
  B.loading = false; renderBoardTable();
}
async function revealOptimum() {
  B.reveal = !B.reveal;
  if (B.reveal && !B.opt) {
    if (S.r.opt?.data) B.opt = S.r.opt.data;
    else { try { B.opt = await api('POST', '/api/optimize', { plan: { decisions: S.ds.reference.doc_example.decisions } }); } catch (e) { toast('Оптимизатор недоступен: ' + e.message); B.reveal = false; } }
  }
  renderBoard();
}
function renderBoard() {
  const sc = S.r.score?.data, has = !!(sc && S.plan);
  $('#tab-board').innerHTML = `
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div><h1 class="disp m-0 text-[44px] font-black leading-[.95]">Лидерборд${CONFIG.SESSION ? ' · комната ' + esc(CONFIG.SESSION) : ''}</h1>
        <p class="mt-2 text-graph">Сортировка по Score. Следите и за рейтингом: аким с лучшим Score не всегда переизбирается.</p></div>
      <button id="btnReveal" class="btn ${B.reveal ? 'btn-ink' : 'btn-line'}">${B.reveal ? 'Скрыть оптимум движка' : 'Показать оптимум движка'}</button>
    </div>
    <div class="grid gap-4 lg:grid-cols-[320px_1fr]">
      <form id="lbForm" class="plate h-fit p-4">
        <div class="lbl mb-2">Сохранить результат</div>
        ${has ? `<div class="tape mb-3">Score ${num(sc.score)} · рейтинг ${num(sc.approval?.city, 1)}%${S.crisis ? '<br><span class="text-graph">в таблицу попадёт Score этого плана без учёта кризиса</span>' : ''}</div>` : '<div class="tape mb-3 text-graph">Сначала получите вердикт в кабинете.</div>'}
        <label class="lbl" for="team">Название команды</label>
        <input id="team" maxlength="${40 - TAG.length}" required autocomplete="off" placeholder="Например, «Сарыарка вперёд»" class="mt-1 w-full border-[1.5px] border-ink bg-white px-3 py-2.5 text-[15px] focus:border-peni" ${has ? '' : 'disabled'}>
        <button class="btn btn-ink mt-3 w-full" ${has ? '' : 'disabled'}>Сохранить в таблицу</button>
        <div id="lbMsg" class="mt-2 min-h-[18px] text-[13px] text-graph" aria-live="polite"></div>
      </form>
      <div class="paper min-w-0 p-4"><div class="mb-2 flex items-center justify-between"><span class="lbl">Таблица</span><span id="lbStatus" class="mono text-[11px] text-graph"></span></div><div id="lbTable" class="overflow-x-auto"></div></div>
    </div>`;
  $('#btnReveal').onclick = revealOptimum;
  $('#lbForm').onsubmit = async (e) => {
    e.preventDefault();
    const team = $('#team').value.trim(); if (!team || !S.plan) return;
    $('#lbMsg').innerHTML = spinner('Отправляем…');
    try {
      const full = team + TAG;
      const r = await api('POST', '/api/submit', { team: full, plan: S.plan, score: sc.score });
      B.mine = full; $('#lbMsg').textContent = r.rank != null ? `Готово — вы на ${r.rank}-м месте в общей таблице.` : 'Готово — результат сохранён.'; $('#team').value = '';
      refreshBoard();
    } catch (err) { $('#lbMsg').textContent = 'Не удалось сохранить: ' + err.message; }
  };
  renderBoardTable();
}
function renderBoardTable() {
  const t = $('#lbTable'), st = $('#lbStatus'); if (!t) return;
  st.innerHTML = B.loading && !B.rows ? '<span class="spin"></span>' : B.error ? '<span class="red">нет связи — повторяем</span>' : B.updated ? `обновлено ${new Date(B.updated).toLocaleTimeString('ru-RU')} · каждые 5 с` : '';
  if (!B.rows) { t.innerHTML = B.error ? `<div class="text-[14px] text-graph">Лидерборд недоступен: ${esc(B.error)}</div>` : `${skel('h-10')}${skel('h-10', 'mt-2')}${skel('h-10', 'mt-2')}`; return; }
  const pinned = [];
  if (B.reveal && B.opt) {
    pinned.push({ team: 'Оптимум движка · перебор 694 395 планов', score: B.opt.best.score, approval: B.opt.best.approval, cost: B.opt.best.cost, plan: B.opt.best.plan, pin: 'opt' });
    if (B.opt.balanced) pinned.push({ team: 'Баланс · лучший план с рейтингом от 50%', score: B.opt.balanced.score, approval: B.opt.balanced.approval, cost: B.opt.balanced.cost, plan: B.opt.balanced.plan, pin: 'bal' });
  }
  const rows = [...pinned, ...B.rows].sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
  if (!rows.length) { t.innerHTML = '<div class="py-6 text-center text-graph">Пока пусто. Будьте первыми.</div>'; return; }
  let place = 0;
  t.innerHTML = `<table class="log" style="min-width:560px"><thead><tr><th>#</th><th>Команда</th><th>Score</th><th>Рейтинг</th><th>Итог</th><th>Бюджет</th></tr></thead><tbody>
    ${rows.map((r) => { const re = (r.approval ?? 0) >= 50, mine = B.mine && r.team === B.mine; if (!r.pin) place++;
      return `<tr data-pin="${r.pin || ''}" class="${r.pin === 'opt' ? 'pin-opt' : r.pin === 'bal' ? 'pin-bal' : mine ? 'me' : ''}" ${r.plan ? `title="${esc(planDecs(r.plan).map(decShort).join(', '))}"` : ''}>
        <td>${r.pin ? (r.pin === 'opt' ? '◆' : '▲') : place}</td><td style="font-family:'Sofia Sans';font-weight:600">${esc(String(r.team).replace(/\s\[[^\]]+\]$/, ''))}</td>
        <td><b>${num(r.score)}</b></td><td class="${re ? '' : 'red'}">${r.approval != null ? num(r.approval, 1) + '%' : '—'}</td>
        <td class="${re ? 'peni' : 'red'}"><b>${re ? 'переизбран' : 'уволен'}</b></td><td>${r.cost ?? '—'}</td></tr>`; }).join('')}</tbody></table>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  renderTabs();
  renderCabinetShell();
  let raw = null;
  if (!CONFIG.MOCK) {
    try { raw = await api('GET', '/api/dataset'); SOURCE = 'api'; }
    catch (e) { const b = $('#banner'); b.textContent = 'Сервер недоступен — показываем записанные ответы движка для примера из ТЗ.'; b.classList.remove('hidden'); }
  }
  if (!raw) {
    SOURCE = 'mock';
    try { raw = await mockCall('GET', '/api/dataset'); }
    catch (e) { $('#measures').innerHTML = `<div class="plate p-6 text-[14px] red">Не удалось загрузить данные: ${esc(e.message)}. Запустите сервер: uvicorn api.main:app</div>`; return; }
  }
  indexDataset(raw);
  S.slots = Array(S.ds.decisions_required).fill(null);
  const mb = $('#modeBadge');
  mb.textContent = SOURCE === 'api' ? 'движок онлайн' : 'демо: записанные ответы';
  if (SOURCE === 'api') api('GET', '/api/health').then((h) => { mb.textContent = `движок онлайн · тексты: ${h.provider === 'offline' ? 'шаблон' : 'ИИ, ' + h.provider}`; }).catch(() => {});
  const shared = planFromParam();
  if (shared) { loadPlan(shared); toast('Загружен план из ссылки'); } else onPlanChange();
  const h = location.hash.replace('#', '');
  go(h === 'board' ? 'board' : 'cabinet');
}
boot();
</script>
</body>
</html>
