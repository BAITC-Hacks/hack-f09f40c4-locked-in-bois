<script>
'use strict';
/* =====================================================================
   CONFIG — the ONE place to point the page at a backend.
   ?mock=1        → replay web/mock/*.json fixtures (real API responses for the doc example)
   ?api=https://… → API base URL (default: same origin; FastAPI serves this page at /)
   ?session=room1 → leaderboard room for the QR audience
   ?seed=1        → fixed crisis event (events[seed % 3]); random otherwise
   ===================================================================== */
const QS = new URLSearchParams(location.search);
const CONFIG = {
  API_BASE: (QS.get('api') || '').replace(/\/$/, ''),
  MOCK: QS.get('mock') === '1',
  SESSION: (QS.get('session') || '').trim().replace(/[\[\]]/g, '').slice(0, 12),
  SEED: QS.has('seed') && !isNaN(parseInt(QS.get('seed'), 10)) ? parseInt(QS.get('seed'), 10) : null,
  TIMEOUT_MS: 15000,
  LLM_TIMEOUT_MS: 120000,
};

/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (x, d = 2) => (x == null || isNaN(x) ? '—' : Number(x).toFixed(d).replace('.', ','));
const int = (x) => (x == null || isNaN(x) ? '—' : Math.round(Number(x)).toLocaleString('ru-RU'));
const sign = (x, d = 2) => (x == null || isNaN(x) ? '—' : (x > 0 ? '+' : x < 0 ? '−' : '±') + num(Math.abs(x), d));
const pct = (x, d = 0) => (x == null || isNaN(x) ? '—' : num(x, d) + '%');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const plural = (n, one, few, many) => { const a = n % 10, b = n % 100; return a === 1 && b !== 11 ? one : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? few : many; };
const skel = (h = 'h-24', extra = '') => `<div class="skel ${h} ${extra}"></div>`;
const spinner = (t = 'Загрузка…') => `<span class="inline-flex items-center gap-2 text-slate-400"><span class="spin"></span>${esc(t)}</span>`;
function toast(msg) {
  const t = $('#toast');
  t.innerHTML = `<div class="fade-in rounded-xl border border-base-600 bg-base-800 px-4 py-2.5 text-sm shadow-2xl">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.innerHTML = ''), 2600);
}

/* ---------------- API layer ---------------- */
let SOURCE = null; // 'api' | 'mock'
class HttpError extends Error { constructor(status, msg) { super(msg); this.status = status; } }

async function api(method, path, body, { timeout = CONFIG.TIMEOUT_MS } = {}) {
  if (SOURCE === 'mock') return mockCall(method, path, body);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(CONFIG.API_BASE + path, {
      method, signal: ctl.signal,
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!r.ok) {
      let detail = '';
      try { const j = await r.json(); detail = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); } catch (e) {}
      throw new HttpError(r.status, detail || `Ошибка сервера ${r.status}`);
    }
    return await r.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('Сервер не ответил вовремя');
    if (e instanceof HttpError) throw e;
    throw new Error('Нет связи с сервером');
  } finally { clearTimeout(timer); }
}

/* mock: replays real API fixtures captured by web/tools/capture_fixtures.py (doc example plan) */
const FIX = {};
const fx = (name) => (FIX[name] ||= fetch('mock/' + name + '.json').then((r) => { if (!r.ok) throw new Error('mock ' + name); return r.json(); }));
const LB_KEY = 'akim.leaderboard.v2';
const lbLoad = () => { try { const x = JSON.parse(localStorage.getItem(LB_KEY)); if (Array.isArray(x)) return x; } catch (e) {} return []; };
const lbSave = (x) => { try { localStorage.setItem(LB_KEY, JSON.stringify(x)); } catch (e) {} };
async function mockCall(method, path, body) {
  await sleep(150 + Math.random() * 250);
  const plan = body && (body.plan || body);
  const p = path.split('?')[0];
  if (p === '/api/dataset') return fx('dataset');
  if (p === '/api/health') return { ok: true, provider: 'mock' };
  if (p === '/api/validate') return localValidate(plan);
  const need = (pl) => { const v = localValidate(pl); if (!v.valid) throw new HttpError(422, v.reason); };
  if (p === '/api/score') { need(plan); return fx('score'); }
  if (p === '/api/optimize') return fx('optimize');
  if (p === '/api/analyze') return fx('analyze');
  if (p === '/api/narrative') return fx(body.event_id ? 'narrative_crisis' : 'narrative');
  if (p === '/api/shock') return fx('shock');
  if (p === '/api/shock/resolve') { need(applySwap(plan, body.swap)); return fx('resolve'); }
  if (p === '/api/submit') {
    const s = await fx('score'); const all = lbLoad();
    all.push({ team: body.team, score: s.score, cost: s.cost, approval: s.approval.city, plan, created_at: new Date().toISOString() });
    lbSave(all); return { ok: true, id: all.length, rank: all.filter((r) => r.score > s.score).length + 1 };
  }
  if (p === '/api/leaderboard') return lbLoad().sort((a, b) => b.score - a.score);
  throw new Error('mock: нет ответа для ' + p);
}

/* ---------------- dataset helpers ---------------- */
const S = {
  ds: null, mi: {}, dir: {}, ind: {}, dist: {},
  slots: [], val: null, validating: false, valSeq: 0,
  plan: null, run: 0,
  r: { score: null, opt: null, ai: null, nar: null },   // each: {loading}|{data}|{error}
  crisis: null,                                         // {event, swap, result, before}
  tab: 'cabinet', provider: null,
};
const IND_SHORT = { T1: 'дороги', T2: 'общ. транспорт', E1: 'зелень', E2: 'воздух', S1: 'школы', S2: 'поликлиники', B1: 'улицы', B2: 'ДТП', C1: 'ЖКХ', C2: 'обращения' };
const indShort = (c) => IND_SHORT[c] || S.ind[c]?.name || c;
const dirName = (id) => S.dir[id]?.name || id;
const gen = (name) => S.dist[name]?.cases?.gen || name;
const loc = (name) => S.dist[name]?.cases?.loc || name;
const realized = (m) => Math.max(0, S.ds.horizon_quarters - m.lag) / S.ds.horizon_quarters;
const districtD = (d) => S.ds.indicators.reduce((s, i) => s + i.weight * d.values[i.code], 0);
const planOf = () => ({ decisions: S.slots.filter(Boolean).map((s) => ({ measure: s.measure, district: s.district ?? null })) });
const decShort = (d) => `${d.measure}${d.district ? ' · ' + d.district : ''}`;
const decLong = (d) => { const m = S.mi[d.measure]; return m ? `${m.id} «${m.name}»${d.district ? ' · ' + d.district : ''}` : d.measure; };
const planDecs = (p) => (Array.isArray(p) ? p : p?.decisions) || [];
function applySwap(plan, swap) {
  const decs = planDecs(plan).map((d) => ({ ...d }));
  const i = decs.findIndex((d) => d.measure === swap?.out);
  if (i >= 0 && swap?.in) decs[i] = { measure: swap.in.measure, district: swap.in.district ?? null };
  return { decisions: decs };
}
function indexDataset(raw) {
  const ds = raw;
  ds.budget ??= 100; ds.horizon_quarters ??= 8; ds.decisions_required ??= 5; ds.max_per_direction ??= 2; ds.crit_threshold ??= 40;
  S.ds = ds;
  S.mi = Object.fromEntries(ds.measures.map((m) => [m.id, m]));
  S.dir = Object.fromEntries(ds.directions.map((d) => [d.id, d]));
  S.ind = Object.fromEntries(ds.indicators.map((i) => [i.code, i]));
  S.dist = Object.fromEntries(ds.districts.map((d) => [d.name, d]));
}
const BASELINE = () => S.ds?.reference?.baseline_score ?? 52.56;

/* local validator: same rules and order as engine/validate.py. Used for instant UI hints + mock mode.
   With {partial:true} the "exactly 5" rule is skipped so conflicts show up while the plan is being built. */
function localValidate(plan, { partial = false } = {}) {
  const ds = S.ds, decs = planDecs(plan), ms = S.mi;
  let cost = 0; const counts = Object.fromEntries(ds.directions.map((d) => [d.id, 0]));
  for (const d of decs) { const m = ms[d.measure]; if (m) { cost += m.cost; counts[m.direction] = (counts[m.direction] || 0) + 1; } }
  const res = (reason) => ({ valid: !reason, reason: reason || null, cost, remaining: ds.budget - cost, direction_counts: counts });
  if (!partial && decs.length !== ds.decisions_required) return res(`Нужно ровно ${ds.decisions_required} решений, выбрано ${decs.length}`);
  const ids = decs.map((d) => d.measure);
  if (new Set(ids).size !== ids.length) return res('Повторы запрещены: каждая мера — не больше одного раза');
  for (const d of decs) if (!ms[d.measure]) return res(`Неизвестная мера ${d.measure}`);
  if (cost > ds.budget) return res(`Бюджет превышен: ${cost} из ${ds.budget}`);
  for (const d of decs) {
    const m = ms[d.measure];
    if (m.type === 'district' && !d.district) return res(`${m.id}: для районной меры нужен район`);
    if (m.type === 'city' && d.district) return res(`${m.id}: городская мера, район не указывается`);
  }
  for (const [k, n] of Object.entries(counts)) if (n > ds.max_per_direction) return res(`Не более ${ds.max_per_direction} мер из направления «${dirName(k)}»`);
  for (const inc of ds.incompatibilities || []) {
    const [a, b] = inc.pair; const A = decs.filter((d) => d.measure === a), B = decs.filter((d) => d.measure === b);
    if (A.length && B.length && (inc.scope === 'anywhere' || A.some((x) => B.some((y) => x.district === y.district)))) return res(inc.reason);
  }
  return res(null);
}
/* why can't measure m (optionally in district) be added to the current slots? */
function blockReason(m, district, decs) {
  if (decs.some((d) => d.measure === m.id)) return 'Уже в плане';
  if (decs.length >= S.ds.decisions_required) return 'Все 5 слотов заняты';
  const n = decs.filter((d) => S.mi[d.measure]?.direction === m.direction).length;
  if (n >= S.ds.max_per_direction) return `В направлении уже ${S.ds.max_per_direction} меры`;
  for (const inc of S.ds.incompatibilities || []) {
    if (!inc.pair.includes(m.id)) continue;
    const other = inc.pair[0] === m.id ? inc.pair[1] : inc.pair[0];
    const hits = decs.filter((d) => d.measure === other);
    if (!hits.length) continue;
    if (inc.scope === 'anywhere') return inc.reason;
    if (district && hits.some((h) => h.district === district)) return inc.reason;
  }
  return null;
}

/* ---------------- tabs ---------------- */
const TABS = [{ id: 'cabinet', name: 'Кабинет акима' }, { id: 'verdict', name: 'Вердикт' }, { id: 'paper', name: 'Астана Times' }, { id: 'board', name: 'Лидерборд' }];
function renderTabs() {
  $('#tabs').innerHTML = TABS.map((t) => `<button role="tab" data-go="${t.id}" aria-selected="${S.tab === t.id}"
    class="tab-btn whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium text-slate-400 hover:text-white">${t.name}</button>`).join('');
}
function go(tab) {
  S.tab = tab;
  $$('main > section').forEach((s) => (s.hidden = s.dataset.tab !== tab));
  $('#mobileBar').hidden = tab !== 'cabinet';
  renderTabs();
  if (tab === 'verdict') renderVerdict();
  if (tab === 'paper') renderPaper();
  if (tab === 'board') startBoard(); else stopBoard();
  history.replaceState(null, '', location.pathname + location.search + '#' + tab);
  window.scrollTo(0, 0);
}
document.addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) go(b.dataset.go); });

/* =====================================================================
   КАБИНЕТ АКИМА
   ===================================================================== */
function renderCabinetShell() {
  $('#tab-cabinet').innerHTML = `
    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div>
        <div class="card-h mb-1">Кабинет акима · Астана, 8 кварталов до IV кв. 2028</div>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Пять решений. Сто единиц. Пять районов ждут.</h1>
        <p class="mt-1.5 max-w-2xl text-sm text-slate-400">Ровно 5 мер, не больше 2 из одного направления, бюджет 100. Районную меру привязываем к району. Эффект растёт после лага: к концу срока реализуется только его часть.</p>
      </div>
      <div class="flex gap-2">
        <button id="btnExample" class="rounded-lg border border-base-600 px-3 py-2 text-sm text-slate-200 hover:border-accent hover:text-white">Пример из ТЗ</button>
        <button id="btnClear" class="rounded-lg border border-base-700 px-3 py-2 text-sm text-slate-400 hover:text-white">Очистить</button>
      </div>
    </div>
    <div class="grid gap-6 lg:grid-cols-[1fr_340px]">
      <div id="measures" class="space-y-7">${skel('h-40')}${skel('h-40')}${skel('h-40')}</div>
      <aside id="rail" class="lg:sticky lg:top-20 lg:self-start">${skel('h-96')}</aside>
    </div>`;
  $('#btnExample').onclick = () => { if (!S.ds) return; loadPlan(S.ds.reference?.doc_example?.decisions || []); toast('Загружен пример из ТЗ: Score 56,54'); };
  $('#btnClear').onclick = () => { if (!S.ds) return; S.slots = Array(S.ds.decisions_required).fill(null); onPlanChange(); };
}

function renderMeasures() {
  const decs = planOf().decisions;
  const slotOf = Object.fromEntries(S.slots.map((s, i) => s && [s.measure, { ...s, slot: i }]).filter(Boolean));
  $('#measures').innerHTML = S.ds.directions.map((d) => {
    const list = S.ds.measures.filter((m) => m.direction === d.id);
    const cnt = decs.filter((x) => S.mi[x.measure]?.direction === d.id).length;
    return `<div>
      <div class="mb-3 flex items-center gap-3">
        <h2 class="text-base font-semibold">${esc(d.name)}</h2>
        <span class="text-[11px] text-slate-500">${(d.indicators || []).map((c) => `${c} ${indShort(c)}`).join(' · ')}</span>
        <span class="rounded-full px-2 py-0.5 text-[11px] font-semibold ${cnt >= S.ds.max_per_direction ? 'bg-accent/15 text-accent' : 'bg-base-800 text-slate-400'}">${cnt}/${S.ds.max_per_direction}</span>
        <div class="h-px flex-1 bg-base-700"></div>
      </div>
      <div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
      ${list.map((m) => {
        const sel = slotOf[m.id];
        const reason = sel ? null : blockReason(m, null, decs);
        const eff = Object.entries(m.effects || {}).map(([k, v]) => `<span title="${esc(S.ind[k]?.name || k)}" class="rounded-md ${v < 0 ? 'bg-red-500/10 text-red-300' : 'bg-base-800 text-slate-300'} px-1.5 py-0.5 text-[11px]">${v > 0 ? '+' : '−'}${Math.abs(v)} ${esc(indShort(k))}</span>`).join('');
        const incs = (S.ds.incompatibilities || []).filter((i) => i.pair.includes(m.id)).map((i) => (i.pair[0] === m.id ? i.pair[1] : i.pair[0]) + (i.scope === 'same_district' ? ' в том же районе' : ''));
        const share = Math.round(realized(m) * 100);

function renderRail() {
  const plan = planOf(), decs = plan.decisions;
  const local = localValidate(plan, { partial: true });
  const used = local.cost, over = used > S.ds.budget, full = decs.length === S.ds.decisions_required;
  const v = S.val;
  const pctW = Math.min(100, (used / S.ds.budget) * 100);
  const okServer = v && v.valid && !S.validating;
  const canSubmit = okServer && full && !over;
  let msg, tone;
  if (over) { msg = `Перерасход: ${used} из ${S.ds.budget}. Уберите одну из дорогих мер.`; tone = 'err'; }
  else if (local.reason) { msg = local.reason; tone = 'err'; }
  else if (!full) { const k = S.ds.decisions_required - decs.length; msg = `Выберите ещё ${k} ${plural(k, 'решение', 'решения', 'решений')}.`; tone = 'wait'; }
  else if (S.validating || !v) { msg = null; tone = 'load'; }
  else if (v.valid) { msg = `План принят к рассмотрению. Остаток ${v.remaining} ед. не сгорает и не даёт бонуса.`; tone = 'ok'; }
  else { msg = v.reason || 'План не проходит проверку'; tone = 'err'; }
  const toneCls = { ok: 'text-emerald-300', err: 'text-red-300', wait: 'text-slate-300', load: 'text-slate-400' }[tone];
  const icon = { ok: ['✓', 'bg-emerald-400/20'], err: ['!', 'bg-red-500/20'], wait: ['…', 'bg-base-700'], load: ['', ''] }[tone];
  const msgHtml = tone === 'load' ? spinner('Проверяем на сервере…') : `<div class="flex items-start gap-2 text-sm ${toneCls}"><span class="mt-0.5 grid h-4 w-4 shrink-0 place-items-center rounded-full ${icon[1]} text-[10px] font-bold">${icon[0]}</span><span>${esc(msg)}</span></div>`;

  $('#rail').innerHTML = `
    <div class="card p-4">
      <div class="card-h mb-3">План акима</div>
      <ol class="space-y-2">
        ${S.slots.map((s, i) => {
          if (!s) return `<li class="flex items-center gap-3 rounded-xl border border-dashed border-base-600 px-3 py-2.5 text-sm text-slate-500"><span class="grid h-6 w-6 place-items-center rounded-full bg-base-800 text-xs">${i + 1}</span>Пустой слот</li>`;
          const m = S.mi[s.measure];
          return `<li class="fade-in flex items-center gap-3 rounded-xl border border-base-700 bg-base-850 px-3 py-2">
            <span class="grid h-6 w-6 shrink-0 place-items-center rounded-full bg-accent text-xs font-bold text-base-950">${i + 1}</span>
            <div class="min-w-0 flex-1"><div class="truncate text-sm font-medium"><span class="text-slate-400">${esc(s.measure)}</span> ${esc(m ? m.name : '')}</div>
              <div class="text-[11px] text-slate-400">${m ? esc(m.cost) + ' ед. · ' + esc(dirName(m.direction)) : ''}${s.district ? ' · <span class="text-amber-300">' + esc(s.district) + '</span>' : ''}</div></div>
            <button class="rounded-md px-1.5 text-lg leading-none text-slate-500 hover:text-white" data-remove="${i}" aria-label="Убрать">×</button>
          </li>`;
        }).join('')}
      </ol>
      <div class="mt-5">
        <div class="flex items-baseline justify-between text-sm"><span class="text-slate-400">Бюджет</span>
          <span class="font-bold tabular-nums ${over ? 'text-red-400' : ''}">${used} <span class="font-normal text-slate-500">/ ${S.ds.budget}</span></span></div>
        <div class="mt-2 h-2.5 overflow-hidden rounded-full bg-base-800"><div class="h-full rounded-full transition-all duration-300 ${over ? 'bg-red-500' : 'bg-accent'}" style="width:${pctW}%"></div></div>
        <div class="mt-1.5 text-[12px] ${over ? 'text-red-400' : 'text-slate-400'}">${over ? `Перерасход на ${used - S.ds.budget} ед.` : `Остаток ${S.ds.budget - used} ед. — <span class="text-slate-300">не сгорает и не даёт бонуса</span>`}</div>
      </div>
      <div class="mt-5 grid grid-cols-5 gap-1.5">
        ${S.ds.directions.map((d) => { const c = local.direction_counts[d.id] || 0; const bad = c > S.ds.max_per_direction; return `
          <div class="rounded-lg border ${bad ? 'border-red-500/60' : c ? 'border-accent/40' : 'border-base-700'} px-1 py-1.5 text-center" title="${esc(d.name)}">
            <div class="text-sm font-bold tabular-nums ${bad ? 'text-red-400' : c ? 'text-accent' : 'text-slate-500'}">${c}/${S.ds.max_per_direction}</div>
            <div class="truncate text-[10px] text-slate-400">${esc(d.name)}</div></div>`; }).join('')}
      </div>
      <div class="mt-5 min-h-[44px] rounded-xl bg-base-850 px-3 py-2.5" aria-live="polite">${msgHtml}</div>
      <button id="btnSubmit" class="mt-4 w-full rounded-xl px-4 py-3 text-sm font-bold transition ${canSubmit ? 'bg-accent text-base-950 hover:brightness-110' : 'cursor-not-allowed bg-base-800 text-slate-500'}" ${canSubmit ? '' : 'disabled'}>Принять решения</button>
    </div>`;
  $$('#rail [data-remove]').forEach((b) => (b.onclick = () => { S.slots[+b.dataset.remove] = null; onPlanChange(); }));
  $('#btnSubmit').onclick = submitPlan;
  $('#mobileBar').innerHTML = `
    <div class="flex items-center gap-3">
      <div class="min-w-0 flex-1">
        <div class="flex items-baseline gap-2 text-sm"><b class="tabular-nums ${over ? 'text-red-400' : ''}">${used}/${S.ds.budget}</b><span class="text-slate-400">· ${decs.length}/${S.ds.decisions_required} решений</span></div>
        <div class="mt-1 h-1.5 overflow-hidden rounded-full bg-base-800"><div class="h-full ${over ? 'bg-red-500' : 'bg-accent'}" style="width:${pctW}%"></div></div>

    </div>`;
  $('#btnSubmitM').onclick = submitPlan;
}

function pickMeasure(mid) {
  const m = S.mi[mid];
  const idx = S.slots.findIndex((s) => s && s.measure === mid);
  if (idx >= 0) { S.slots[idx] = null; onPlanChange(); return; }
  const free = S.slots.findIndex((s) => !s);
  if (free < 0) { toast('Все пять слотов заняты — уберите одно решение'); return; }
  if (m.type === 'district') openDistrictPicker(m, (name) => { S.slots[free] = { measure: mid, district: name }; onPlanChange(); });
  else { S.slots[free] = { measure: mid, district: null }; onPlanChange(); }
}

function districtOptionsHtml(m, decs, attr = 'data-pick') {
  const share = realized(m);
  return S.ds.districts.map((k) => {
    const block = blockReason(m, k.name, decs);
    const cells = Object.entries(m.effects).map(([c, e]) => {
      const now = k.values[c], after = Math.max(0, Math.min(100, now + e * share));
      return `<span class="whitespace-nowrap"><span class="text-slate-500">${esc(indShort(c))}</span> <span class="${now < S.ds.crit_threshold ? 'font-bold text-red-400' : ''}">${num(now, 0)}</span>→<b class="${after < S.ds.crit_threshold ? 'text-red-400' : 'text-white'}">${num(after, 1)}</b></span>`;
    }).join(' ');
    return `<button ${attr}="${esc(k.name)}" ${block ? 'disabled' : ''} class="flex w-full items-start gap-3 rounded-xl border border-base-700 bg-base-850 px-3 py-3 text-left hover:border-accent disabled:cursor-not-allowed disabled:opacity-40">
      <span class="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-base-800 text-xs font-bold">${esc(k.name.slice(0, 2).toUpperCase())}</span>
      <span class="min-w-0 flex-1"><span class="flex items-baseline justify-between gap-2"><span class="font-semibold">${esc(k.name)}</span><span class="text-[11px] text-slate-400">${Math.round(k.pop * 100)}% жителей · D ${num(districtD(k))}</span></span>
        <span class="block text-[12px] text-slate-400">${esc(k.profile || '')}</span>
        <span class="mt-1 block text-[12px]">${block ? `<span class="text-red-300">${esc(block)}</span>` : cells}</span></span>
    </button>`;

}
function openDistrictPicker(m, onPick) {
  const decs = planOf().decisions;
  openModal(`
    <div class="card fade-in max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-b-none p-5 sm:rounded-2xl">
      <div class="card-h">${esc(m.id)} · районная мера · ${esc(m.cost)} ед. · лаг ${esc(m.lag)} кв.</div>
      <h3 class="mt-1 text-lg font-bold">${esc(m.name)}</h3>
      <p class="mt-1 text-sm text-slate-400">Где запускаем? Показано, как изменятся показатели района к IV кв. 2028 (реализуется ${Math.round(realized(m) * 100)}% эффекта). Красное — ниже ${S.ds.crit_threshold}, это штраф в Score.</p>

function openModal(html, { dismissable = true } = {}) {
  const md = $('#modal');
  md.innerHTML = html; md.classList.remove('hidden'); md.classList.add('flex');
  md.onclick = (e) => { if ((dismissable && e.target === md) || e.target.closest('[data-close]')) closeModal(); };
  document.body.style.overflow = 'hidden';
}
function closeModal() { const md = $('#modal'); md.classList.add('hidden'); md.classList.remove('flex'); md.innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#modal').classList.contains('hidden') && !$('#modal [data-lock]')) closeModal(); });

function loadPlan(decs) {
  S.slots = Array(S.ds.decisions_required).fill(null);
  planDecs(decs).slice(0, S.ds.decisions_required).forEach((d, i) => (S.slots[i] = { measure: d.measure, district: d.district ?? null }));
  onPlanChange();
}
let valTimer = null;
function onPlanChange() {
  renderMeasures();
  S.validating = true; S.val = null;
  renderRail();
  clearTimeout(valTimer);
  valTimer = setTimeout(runValidate, 120);
}
async function runValidate() {
  const seq = ++S.valSeq;
  let res;
  try { res = await api('POST', '/api/validate', { plan: planOf() }); }
  catch (e) { res = { valid: false, reason: 'Проверка недоступна: ' + e.message }; }
  if (seq !== S.valSeq) return;
  S.val = res; S.validating = false; renderRail();
}

function fetchInto(key, fn, run) {
  S.r[key] = { loading: true };
  return fn().then((d) => { if (run === S.run) S.r[key] = { data: d }; })
    .catch((e) => { if (run === S.run) S.r[key] = { error: e.message }; })
    .finally(() => { if (run === S.run) refresh(key); });
}
function refresh(key) {
  if (S.tab === 'verdict') { if (key === 'score' || !$('#vScore')) renderVerdict(); else fillVerdict(key); }
  if (S.tab === 'paper' && (key === 'nar' || key === 'score' || key === 'opt')) renderPaper();
}
function submitPlan() {
  S.plan = planOf();
  S.run++; S.crisis = null;
  const run = S.run, body = { plan: S.plan, lang: 'ru' };
  go('verdict');
  fetchInto('score', () => api('POST', '/api/score', body), run);
  fetchInto('opt', () => api('POST', '/api/optimize', body), run);
  fetchInto('ai', () => api('POST', '/api/analyze', body, { timeout: CONFIG.LLM_TIMEOUT_MS }), run);
  S.narBody = body;
  loadNarrative();
  renderVerdict();
}
function loadNarrative() {
  const body = S.narBody;
  return fetchInto('nar', () => api('POST', '/api/narrative', body, { timeout: CONFIG.LLM_TIMEOUT_MS }), S.run);
}

function emptyState(title, text, btn = 'В кабинет', to = 'cabinet') {

function gaugeSVG(value, thr) {
  const v = Math.max(0, Math.min(100, Number(value) || 0));
  const R = 80, cx = 100, cy = 95;
  const pt = (p) => { const a = Math.PI * (1 - p / 100); return [cx + R * Math.cos(a), cy - R * Math.sin(a)]; };
  const [x1, y1] = pt(v); const a = Math.PI * (1 - thr / 100);
  const tIn = [cx + (R - 16) * Math.cos(a), cy - (R - 16) * Math.sin(a)], tOut = [cx + (R + 12) * Math.cos(a), cy - (R + 12) * Math.sin(a)];
  const ok = v >= thr;
  return `<svg viewBox="0 -16 200 128" class="w-full max-w-[260px]" role="img" aria-label="Рейтинг ${Math.round(v)}%">
    <path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${cx + R} ${cy}" fill="none" stroke="#1e293b" stroke-width="14" stroke-linecap="round"/>
    ${v > 0.5 ? `<path d="M ${cx - R} ${cy} A ${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${ok ? '#19b8d8' : '#ef4444'}" stroke-width="14" stroke-linecap="round"/>` : ''}
    <line x1="${tIn[0]}" y1="${tIn[1]}" x2="${tOut[0]}" y2="${tOut[1]}" stroke="#e2e8f0" stroke-width="2"/>
    <text x="${tOut[0]}" y="${tOut[1] - 4}" text-anchor="middle" fill="#94a3b8" font-size="8.5">${thr}% · переизбрание</text>
    <text x="100" y="86" text-anchor="middle" fill="#fff" font-size="28" font-weight="800">${num(v, 1)}%</text>
  </svg>`;
}

  ['score', 'opt', 'ai', 'nar'].forEach(fillVerdict);
}

function fillVerdict(key) {
  if (key === 'score') { fillScore(); fillDistricts(); drawScoreCharts(); drawPareto(); }
  if (key === 'opt') { fillRegret(); drawPareto(); }
  if (key === 'ai') fillAI();
  if (key === 'nar') fillCouncil();
}

      <div class="rounded-lg bg-base-850 py-2"><div class="text-sm font-bold tabular-nums">${num(v.d_min)}</div><div class="text-[10px] text-slate-500">слабейший: ${esc(v.d_min_district || '—')}</div></div>

function chartDefaults() {
  Chart.defaults.color = '#94a3b8';
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif';
  Chart.defaults.borderColor = 'rgba(51,65,85,.45)';
}
const ACC = '#19b8d8';
function drawScoreCharts() {
  const v = S.r.score.data; if (!$('#chTimeline')) return;
  chartDefaults();
  const base = v.baseline ?? BASELINE();
  const QL = ['старт', 'I·27', 'II·27', 'III·27', 'IV·27', 'I·28', 'II·28', 'III·28', 'IV·28'];
  const tl = v.timeline || [];
  chart('chTimeline', {
    type: 'line',
    data: { labels: tl.map((t) => QL[t.q] ?? 'Q' + t.q), datasets: [
      { label: 'Score', data: tl.map((t) => t.score), borderColor: ACC, backgroundColor: 'rgba(25,184,216,.12)', fill: true, tension: .25, pointRadius: 3 },
      { label: 'База', data: tl.map(() => base), borderColor: '#475569', borderDash: [5, 5], pointRadius: 0, borderWidth: 1.5 },
    ] },
    options: { maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${num(c.parsed.y)}` } } },
      scales: { x: { ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: 5 } }, y: { suggestedMin: base - 0.3 } } },
  });
  const co = (v.contributions || []).slice().sort((a, b) => b.marginal - a.marginal);
  chart('chContrib', {
    type: 'bar',
    data: { labels: co.map((c) => decShort(c)), datasets: [{ data: co.map((c) => c.marginal), backgroundColor: co.map((c, i) => (i === co.length - 1 ? 'rgba(239,68,68,.6)' : i === 0 ? ACC : 'rgba(25,184,216,.45)')), borderRadius: 6 }] },
    options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false },
      tooltip: { callbacks: { title: (c) => decLong(co[c[0].dataIndex]), label: (c) => { const x = co[c.dataIndex]; return [`вклад ${sign(x.marginal)} Score`, `без меры: ${num(x.score_without)}`, `на единицу бюджета: ${num(x.marginal_per_cost)}`]; } } } },
      scales: { x: { title: { display: true, text: 'Δ Score' } }, y: { ticks: { font: { size: 11 } } } } },
  });
}
function drawPareto() {
  if (!$('#chPareto') || !S.r.score?.data) return;
  const o = S.r.opt?.data; const v = S.r.score.data;
  chartDefaults();
  const me = S.crisis?.before ? { x: S.crisis.before.cost, y: S.crisis.before.score } : { x: v.cost, y: v.score };
  const ds = [{ label: 'Ваш план', data: [me], pointRadius: 9, pointHoverRadius: 11, backgroundColor: '#fff', borderColor: ACC, borderWidth: 4, order: 0 }];
  if (o) {
    ds.push({ label: 'Лучший план не дороже', data: (o.pareto || []).map((p) => ({ x: p.cost, y: p.score, plan: p.plan })), showLine: true, stepped: 'before', borderColor: ACC, backgroundColor: 'rgba(25,184,216,.35)', pointRadius: 3, borderWidth: 2, order: 2 });
    ds.push({ label: `Оптимум · рейтинг ${num(o.best.approval, 1)}%`, data: [{ x: o.best.cost, y: o.best.score, plan: o.best.plan }], pointStyle: 'rectRot', pointRadius: 9, backgroundColor: '#ef4444', borderColor: '#fff', borderWidth: 1.5, order: 1 });
    if (o.balanced) ds.push({ label: `Баланс · рейтинг ${num(o.balanced.approval, 1)}%`, data: [{ x: o.balanced.cost, y: o.balanced.score, plan: o.balanced.plan }], pointStyle: 'triangle', pointRadius: 9, backgroundColor: '#fbbf24', borderColor: '#fff', borderWidth: 1.5, order: 1 });
  }
  chart('chPareto', {
    type: 'scatter', data: { datasets: ds },
    options: { maintainAspectRatio: false, animation: { duration: 400 },
      plugins: { legend: { labels: { boxWidth: 9, usePointStyle: true, font: { size: 11 } } },
        tooltip: { callbacks: { label: (c) => `${c.dataset.label}: ${c.parsed.x} ед. → ${num(c.parsed.y)}`, afterLabel: (c) => { const p = c.raw.plan; return p ? planDecs(p).map(decShort).join(', ') : ''; } } } },
      scales: { x: { title: { display: true, text: 'Потрачено, ед.' }, suggestedMin: 55, suggestedMax: 100 }, y: { title: { display: true, text: 'Score' }, suggestedMin: 55, suggestedMax: 57.4 } } },
  });
}

/* =====================================================================
   КРИЗИС (5-й час)
   ===================================================================== */
const CR = { ev: null, outM: null, inn: null, val: null, validating: false, submitting: false, result: null, error: null, seq: 0 };
async function openCrisis() {
  Object.assign(CR, { ev: null, outM: null, inn: null, val: null, validating: false, submitting: false, result: null, error: null });
  openModal(`<div data-lock class="card fade-in w-full max-w-4xl rounded-b-none p-6 sm:rounded-2xl">${spinner('III квартал. Звонок из штаба…')}</div>`, { dismissable: false });
  const seed = CONFIG.SEED ?? Math.floor(Math.random() * 1000);
  try { CR.ev = await api('POST', '/api/shock', { plan: S.plan, seed }); }
  catch (e) { CR.error = e.message; }
  renderCrisis();
}
function crisisNext() { return CR.outM && CR.inn && (S.mi[CR.inn.measure]?.type !== 'district' || CR.inn.district) ? applySwap(S.plan, { out: CR.outM, in: CR.inn }) : null; }
function renderCrisis() {
  const md = $('#modal'); if (md.classList.contains('hidden')) return;
  const keep = [md.querySelector('[data-lock]')?.scrollTop || 0, md.querySelector('[data-addlist]')?.scrollTop || 0];
  const restore = () => { const a = md.querySelector('[data-lock]'), b = md.querySelector('[data-addlist]'); if (a) a.scrollTop = keep[0]; if (b) b.scrollTop = keep[1]; };
  if (CR.error || !CR.ev) {
    md.innerHTML = `<div data-lock class="card w-full max-w-xl p-6 text-center"><div class="font-semibold">Кризис не загрузился</div>
      <p class="mt-2 text-sm text-slate-400">${esc(CR.error || 'Нет данных')}</p>
      <div class="mt-4 flex justify-center gap-2"><button id="crRetry" class="rounded-xl bg-accent px-4 py-2 text-sm font-bold text-base-950">Повторить</button>
      <button data-close class="rounded-xl border border-base-600 px-4 py-2 text-sm">Закрыть</button></div></div>`;
    $('#crRetry').onclick = openCrisis; return;
  }
  if (CR.result) { renderCrisisResult(); return; }
  const E = CR.ev, ev = E.event;
  const decs = planDecs(S.plan);
  const remaining = decs.filter((d) => d.measure !== CR.outM);
  const next = crisisNext();
  const cost = (next ? planDecs(next) : remaining).reduce((s, d) => s + (S.mi[d.measure]?.cost || 0), 0) + (!next && CR.inn ? S.mi[CR.inn.measure].cost : 0);
  const over = cost > S.ds.budget;
  const canGo = next && CR.val?.valid && !CR.validating && !CR.submitting;
  const effs = Object.entries(ev.effects || {}).map(([k, v]) => `${k} ${indShort(k)} ${v > 0 ? '+' : '−'}${Math.abs(v)} в ${loc(ev.district)}`);
  let status;
  if (!CR.outM) status = 'Шаг 1: выберите меру, от которой откажетесь.';
  else if (!CR.inn) status = 'Шаг 2: выберите, что добавить взамен.';
  else if (!next) status = 'Укажите район для районной меры.';
  else if (CR.validating) status = null;

async function crisisValidate() {
  const next = crisisNext(); const seq = ++CR.seq;
  if (!next) { renderCrisis(); return; }
  CR.validating = true; renderCrisis();
  let r;
  try { r = await api('POST', '/api/validate', { plan: next }); } catch (e) { r = { valid: false, reason: 'Проверка недоступна: ' + e.message }; }
  if (seq !== CR.seq) return;
  CR.val = r; CR.validating = false; renderCrisis();
}
async function crisisSubmit() {
  CR.submitting = true; renderCrisis();
  try {
    CR.result = await api('POST', '/api/shock/resolve', { plan: S.plan, event_id: CR.ev.event.id, swap: { out: CR.outM, in: CR.inn } });
  } catch (e) { CR.val = { valid: false, reason: e.message }; }
  CR.submitting = false; renderCrisis();
}
function crisisComment() {
  const c = S.crisis; if (!c) return '';
  const r = c.result, ev = c.event, bp = r.best_possible_swap;
  const swapTxt = `${c.swap.out} → ${decShort(c.swap.in)}`;
  const parts = [`«${ev.title}» стоил ${num(r.crisis_cost)} Score.`, `Замена ${swapTxt} вернула ${sign(r.recovered)}.`];
  if (r.swap_was_optimal) parts.push('Это лучшая из возможных замен.');
  else if (bp) parts.push(`Лучшей была бы ${bp.out} → ${decShort(bp.in)}: ${sign(bp.gain)}, Score ${num(bp.score)}.`);
  const a = r.approval;
  if (a) parts.push(a.reelected ? `Рейтинг ${num(a.city, 1)}% — аким удерживает кресло.` : `Рейтинг ${num(a.city, 1)}% — ниже 50%: кризис стоил акиму кресла.`);
  return parts.join(' ');
}

    <div class="mb-6 flex flex-wrap items-end justify-between gap-4">
      <div><div class="card-h mb-1">Лидерборд${CONFIG.SESSION ? ' · комната ' + esc(CONFIG.SESSION) : ''}</div>
        <h1 class="text-2xl font-bold tracking-tight sm:text-3xl">Кто лучше управляет Астаной</h1>
        <p class="mt-1.5 text-sm text-slate-400">Сортировка по Score. Но смотрите на рейтинг: лучший индекс не всегда переизбирают.</p></div>
      <button id="btnReveal" class="rounded-xl border ${B.reveal ? 'border-red-400/60 text-red-200' : 'border-base-600'} px-4 py-2.5 text-sm font-semibold">${B.reveal ? 'Скрыть оптимум машины' : 'Показать оптимум машины'}</button>
    </div>
    <div class="grid gap-4 lg:grid-cols-[340px_1fr]">
      <form id="lbForm" class="card h-fit p-5">
        <div class="card-h mb-3">Сохранить результат</div>
        ${has ? `<div class="mb-3 rounded-xl bg-base-850 p-3 text-sm">Ваш Score <b class="tabular-nums">${num(sc.score)}</b> · рейтинг <b class="tabular-nums">${num(sc.approval?.city, 1)}%</b>${S.crisis ? '<div class="mt-1 text-[11px] text-slate-500">Сервер пересчитает Score по плану без кризиса.</div>' : ''}</div>`
          : '<div class="mb-3 rounded-xl border border-dashed border-base-600 p-3 text-sm text-slate-400">Сначала получите вердикт в кабинете.</div>'}
        <label class="text-[12px] text-slate-400" for="team">Название команды</label>
        <input id="team" maxlength="${40 - TAG.length}" required autocomplete="off" placeholder="Например, «Сарыарка вперёд»" class="mt-1 w-full rounded-xl border border-base-600 bg-base-900 px-3 py-2.5 text-sm outline-none focus:border-accent" ${has ? '' : 'disabled'}>
        <button class="mt-3 w-full rounded-xl px-4 py-2.5 text-sm font-bold ${has ? 'bg-accent text-base-950' : 'cursor-not-allowed bg-base-800 text-slate-500'}" ${has ? '' : 'disabled'}>Отправить</button>
        <div id="lbMsg" class="mt-2 min-h-[18px] text-[12px] text-slate-400"></div>
      </form>
      <div class="card overflow-hidden">
        <div class="flex items-center justify-between border-b border-base-700 px-5 py-3"><div class="card-h">Таблица</div><div id="lbStatus" class="text-[11px] text-slate-500"></div></div>
        <div id="lbTable" class="overflow-x-auto"></div>
      </div>
    </div>`;
  $('#btnReveal').onclick = revealOptimum;
  $('#lbForm').onsubmit = async (e) => {
    e.preventDefault();
    const team = $('#team').value.trim(); if (!team || !S.plan) return;
    $('#lbMsg').innerHTML = spinner('Отправляем…');
    try {
      const full = team + TAG;
      const r = await api('POST', '/api/submit', { team: full, plan: S.plan, score: sc.score });
      B.mine = full; $('#lbMsg').textContent = `Готово — вы на ${r.rank ?? '?'}-м месте в общей таблице.`; $('#team').value = '';
      refreshBoard();
    } catch (err) { $('#lbMsg').textContent = 'Не удалось отправить: ' + err.message; }
  };
  renderBoardTable();
}
function renderBoardTable() {
  const t = $('#lbTable'), st = $('#lbStatus'); if (!t) return;
  st.innerHTML = B.loading && !B.rows ? '<span class="spin"></span>' : B.error ? '<span class="text-red-400">нет связи — повторяем</span>' : B.updated ? `обновлено ${new Date(B.updated).toLocaleTimeString('ru-RU')} · каждые 5 с` : '';
  if (!B.rows) { t.innerHTML = B.error ? `<div class="p-5 text-sm text-slate-400">Лидерборд недоступен: ${esc(B.error)}</div>` : `<div class="space-y-2 p-5">${Array(4).fill(skel('h-10')).join('')}</div>`; return; }
  const pinned = [];
  if (B.reveal && B.opt) {
    pinned.push({ team: 'Машинный оптимум · перебор 694 395 планов', score: B.opt.best.score, approval: B.opt.best.approval, cost: B.opt.best.cost, plan: B.opt.best.plan, pin: 'opt' });
    if (B.opt.balanced) pinned.push({ team: 'Баланс ИИ · лучший план с рейтингом ≥50%', score: B.opt.balanced.score, approval: B.opt.balanced.approval, cost: B.opt.balanced.cost, plan: B.opt.balanced.plan, pin: 'bal' });
  }
  const rows = [...pinned, ...B.rows].sort((a, b) => (b.score ?? 0) - (a.score ?? 0));
  if (!rows.length) { t.innerHTML = '<div class="p-6 text-center text-sm text-slate-400">Пока пусто. Будьте первыми.</div>'; return; }
  let place = 0;
  t.innerHTML = `<table class="w-full min-w-[560px] text-sm"><thead><tr class="text-[11px] uppercase tracking-wider text-slate-500">
    <th class="px-5 py-2.5 text-left font-semibold">#</th><th class="py-2.5 text-left font-semibold">Команда</th><th class="px-3 py-2.5 text-right font-semibold">Score</th>
    <th class="px-3 py-2.5 text-right font-semibold">Рейтинг</th><th class="px-3 py-2.5 text-left font-semibold">Итог</th><th class="px-5 py-2.5 text-right font-semibold">Бюджет</th></tr></thead>
    <tbody>${rows.map((r) => {
      const re = (r.approval ?? 0) >= 50; const mine = B.mine && r.team === B.mine;
      if (!r.pin) place++;
      const name = String(r.team).replace(/\s\[[^\]]+\]$/, '');
      const pinCls = r.pin === 'opt' ? 'bg-red-500/10' : r.pin === 'bal' ? 'bg-amber-400/5' : mine ? 'bg-accent/10' : '';
      return `<tr data-pin="${r.pin || ''}" class="border-t border-base-800 ${pinCls}" ${r.plan ? `title="${esc(planDecs(r.plan).map(decShort).join(', '))}"` : ''}>
        <td class="px-5 py-3 font-bold tabular-nums ${r.pin ? 'text-slate-500' : place === 1 ? 'text-accent' : 'text-slate-400'}">${r.pin ? (r.pin === 'opt' ? '◆' : '▲') : place}</td>
        <td class="py-3 font-medium ${r.pin === 'opt' ? 'text-red-200' : r.pin === 'bal' ? 'text-amber-200' : ''}">${esc(name)}</td>
        <td class="px-3 py-3 text-right font-bold tabular-nums">${num(r.score)}</td>
        <td class="px-3 py-3 text-right tabular-nums ${re ? '' : 'text-red-400'}">${r.approval != null ? num(r.approval, 1) + '%' : '—'}</td>
        <td class="px-3 py-3"><span class="rounded-full px-2 py-0.5 text-[11px] font-bold ${re ? 'bg-accent/15 text-accent' : 'bg-red-500/15 text-red-300'}">${re ? 'Переизбран' : 'Уволен'}</span></td>
        <td class="px-5 py-3 text-right tabular-nums text-slate-400">${r.cost ?? '—'}</td></tr>`;
    }).join('')}</tbody></table>`;
}

/* =====================================================================
   BOOT
   ===================================================================== */
async function boot() {
  renderTabs();
  renderCabinetShell();
  let raw = null;
  if (!CONFIG.MOCK) {
    try { raw = await api('GET', '/api/dataset'); SOURCE = 'api'; }
    catch (e) { const b = $('#banner'); b.textContent = 'Сервер недоступен — показываем записанные ответы движка для примера из ТЗ.'; b.classList.remove('hidden'); }
  }
  if (!raw) {
    SOURCE = 'mock';
    try { raw = await mockCall('GET', '/api/dataset'); }
    catch (e) { $('#measures').innerHTML = `<div class="card p-6 text-sm text-red-300">Не удалось загрузить данные: ${esc(e.message)}. Запустите сервер: <code>uvicorn api.main:app</code></div>`; return; }
  }
  indexDataset(raw);
  S.slots = Array(S.ds.decisions_required).fill(null);
  const mb = $('#modeBadge');
  mb.textContent = SOURCE === 'api' ? 'движок · API' : 'демо-запись';
  mb.classList.remove('hidden');
  if (SOURCE === 'api') api('GET', '/api/health').then((h) => { mb.textContent = `движок · ИИ: ${h.provider === 'offline' ? 'офлайн' : h.provider}`; }).catch(() => {});
  onPlanChange();
  const h = location.hash.replace('#', '');
  go(h === 'board' ? 'board' : 'cabinet');
}
boot();
</script>
</body>
</html>
